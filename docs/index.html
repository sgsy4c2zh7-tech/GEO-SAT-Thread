<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

let scene, camera, renderer, controls;
let sunGroup, earthGroup, cloudMesh, magnetosphereGroup;
let cmeGroup;
let clock = new THREE.Clock();

init3D();
animate3D();

function init3D(){
  const container = document.getElementById("view3d");
  const w = container.clientWidth;
  const h = container.clientHeight;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020817);

  camera = new THREE.PerspectiveCamera(45, w/h, 0.1, 5000);
  camera.position.set(0, 120, 320);

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setSize(w, h);
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  container.innerHTML = "";
  container.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.target.set(40, 0, 0);

  // ===== Lights =====
  const ambient = new THREE.AmbientLight(0x7aa2ff, 0.35);
  scene.add(ambient);

  const sunLight = new THREE.PointLight(0xffddaa, 3.2, 0, 2);
  sunLight.position.set(-150, 0, 0);
  scene.add(sunLight);

  // ===== Star background =====
  addStarField();

  // ===== Axes line Sun-Earth =====
  const axisMat = new THREE.LineBasicMaterial({ color:0x35506f, transparent:true, opacity:0.45 });
  const axisGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-150, 0, 0),
    new THREE.Vector3(150, 0, 0)
  ]);
  const axisLine = new THREE.Line(axisGeo, axisMat);
  scene.add(axisLine);

  // ===== Sun =====
  sunGroup = new THREE.Group();
  sunGroup.position.set(-150, 0, 0);
  scene.add(sunGroup);
  createSun();

  // ===== Earth =====
  earthGroup = new THREE.Group();
  earthGroup.position.set(120, 0, 0);
  scene.add(earthGroup);
  createEarth();

  // ===== Magnetosphere =====
  magnetosphereGroup = new THREE.Group();
  magnetosphereGroup.position.copy(earthGroup.position);
  scene.add(magnetosphereGroup);
  createMagnetosphere();

  // ===== CME group =====
  cmeGroup = new THREE.Group();
  scene.add(cmeGroup);

  // サンプルCME
  addSampleCME();

  window.addEventListener("resize", onResize3D);
}

function createSun(){
  const sunGeo = new THREE.SphereGeometry(28, 64, 64);

  const sunMat = new THREE.MeshStandardMaterial({
    color: 0xffa020,
    emissive: 0xff7a00,
    emissiveIntensity: 2.4,
    roughness: 0.75,
    metalness: 0.0
  });

  const sun = new THREE.Mesh(sunGeo, sunMat);
  sunGroup.add(sun);

  // outer glow
  const glowGeo = new THREE.SphereGeometry(34, 48, 48);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0xffb347,
    transparent: true,
    opacity: 0.18,
    side: THREE.BackSide
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  sunGroup.add(glow);

  // corona shell
  const coronaGeo = new THREE.SphereGeometry(40, 48, 48);
  const coronaMat = new THREE.MeshBasicMaterial({
    color: 0xffcc66,
    transparent: true,
    opacity: 0.07,
    side: THREE.BackSide
  });
  const corona = new THREE.Mesh(coronaGeo, coronaMat);
  sunGroup.add(corona);

  sunGroup.userData.sunCore = sun;
  sunGroup.userData.sunGlow = glow;
  sunGroup.userData.sunCorona = corona;
}

function createEarth(){
  const earthRadius = 14;

  // 地球本体
  const earthGeo = new THREE.SphereGeometry(earthRadius, 64, 64);
  const earthMat = new THREE.MeshStandardMaterial({
    color: 0x2f6fff,
    roughness: 0.95,
    metalness: 0.0
  });
  const earth = new THREE.Mesh(earthGeo, earthMat);
  earthGroup.add(earth);

  // 簡易的な大陸っぽいデコ
  const continentMat = new THREE.MeshStandardMaterial({
    color: 0x56a04a,
    roughness: 1.0,
    metalness: 0.0
  });

  const patches = [];
  for(let i=0;i<7;i++){
    const g = new THREE.SphereGeometry(earthRadius*0.22, 18, 18);
    const m = continentMat.clone();
    const patch = new THREE.Mesh(g, m);
    const theta = Math.random()*Math.PI*2;
    const phi = Math.random()*Math.PI;
    const rr = earthRadius*0.92;
    patch.position.set(
      Math.sin(phi)*Math.cos(theta)*rr,
      Math.cos(phi)*rr,
      Math.sin(phi)*Math.sin(theta)*rr
    );
    patch.lookAt(0,0,0);
    patch.scale.set(1.8, 0.8, 1.2);
    earth.add(patch);
    patches.push(patch);
  }

  // 雲レイヤー
  const cloudGeo = new THREE.SphereGeometry(earthRadius*1.03, 64, 64);
  const cloudMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.22,
    roughness: 1.0,
    metalness: 0.0
  });
  cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
  earthGroup.add(cloudMesh);

  // 大気グロー
  const atmoGeo = new THREE.SphereGeometry(earthRadius*1.12, 64, 64);
  const atmoMat = new THREE.MeshBasicMaterial({
    color: 0x66c2ff,
    transparent: true,
    opacity: 0.12,
    side: THREE.BackSide
  });
  const atmosphere = new THREE.Mesh(atmoGeo, atmoMat);
  earthGroup.add(atmosphere);

  earthGroup.userData.earth = earth;
  earthGroup.userData.atmosphere = atmosphere;
}

function createMagnetosphere(){
  const group = magnetosphereGroup;
  group.clear();

  // 磁気圏本体（昼側圧縮・夜側長い）
  const shellMat = new THREE.MeshBasicMaterial({
    color: 0x68a8ff,
    transparent: true,
    opacity: 0.11,
    side: THREE.DoubleSide,
    wireframe: false
  });

  const shellGeo = new THREE.SphereGeometry(34, 64, 64);
  const shell = new THREE.Mesh(shellGeo, shellMat);
  shell.scale.set(1.2, 0.82, 0.82);   // 横長ベース
  shell.position.x = 6;               // 少し夜側にずらす
  group.add(shell);

  // 夜側マグネトテイル
  const tailGeo = new THREE.CylinderGeometry(10, 22, 120, 32, 1, true);
  const tailMat = new THREE.MeshBasicMaterial({
    color: 0x557dff,
    transparent: true,
    opacity: 0.10,
    side: THREE.DoubleSide
  });
  const tail = new THREE.Mesh(tailGeo, tailMat);
  tail.rotation.z = Math.PI/2;
  tail.position.x = 55;
  group.add(tail);

  // bow shock
  const shockGeo = new THREE.SphereGeometry(48, 48, 48, 0, Math.PI*2, 0.4, 2.3);
  const shockMat = new THREE.MeshBasicMaterial({
    color: 0xff8a65,
    transparent: true,
    opacity: 0.08,
    side: THREE.DoubleSide
  });
  const shock = new THREE.Mesh(shockGeo, shockMat);
  shock.rotation.z = Math.PI/2;
  shock.position.x = -8;
  group.add(shock);

  // 磁力線ライン
  for(let i=0;i<8;i++){
    const lat = -0.85 + i*(1.7/7);
    const curve = buildDipoleLikeCurve(lat);
    const pts = curve.getPoints(120);
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineBasicMaterial({
      color: 0x9ecbff,
      transparent: true,
      opacity: 0.55
    });
    const line = new THREE.Line(geo, mat);
    group.add(line);
  }
}

function buildDipoleLikeCurve(latOffset){
  const pts = [];
  for(let t=-Math.PI*0.82; t<=Math.PI*0.82; t+=0.04){
    const r = 18 + 34*Math.pow(Math.cos(t),2);
    let x = Math.cos(t)*r;
    let y = Math.sin(t)*r*0.55 + latOffset*6;
    let z = latOffset*18;
    if(x > 0) x *= 1.8;   // 夜側を長く
    else x *= 0.75;       // 昼側を短く
    pts.push(new THREE.Vector3(x, y, z));
  }
  return new THREE.CatmullRomCurve3(pts);
}

function addStarField(){
  const geo = new THREE.BufferGeometry();
  const count = 2400;
  const arr = new Float32Array(count*3);

  for(let i=0;i<count;i++){
    arr[i*3+0] = (Math.random()-0.5)*1800;
    arr[i*3+1] = (Math.random()-0.5)*1000;
    arr[i*3+2] = (Math.random()-0.5)*1800;
  }

  geo.setAttribute("position", new THREE.BufferAttribute(arr, 3));

  const mat = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 1.5,
    transparent: true,
    opacity: 0.75
  });

  const stars = new THREE.Points(geo, mat);
  scene.add(stars);
}

function addSampleCME(){
  const color = 0xcc66ff;

  const cme = new THREE.Group();

  const waveGeo = new THREE.SphereGeometry(16, 32, 32, -0.45, 0.9, 1.0, 1.1);
  const waveMat = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity: 0.35,
    side: THREE.DoubleSide
  });
  const wave = new THREE.Mesh(waveGeo, waveMat);
  wave.rotation.z = -Math.PI/2;
  cme.add(wave);

  const coreGeo = new THREE.SphereGeometry(3.4, 24, 24);
  const coreMat = new THREE.MeshBasicMaterial({ color:0xd580ff });
  const core = new THREE.Mesh(coreGeo, coreMat);
  core.position.set(0, 0, 0);
  cme.add(core);

  cme.position.set(-90, 20, 0);
  cme.userData.progress = 0;
  cme.userData.speed = 0.12;
  cme.userData.passedEarth = false;

  cmeGroup.add(cme);
}

function animate3D(){
  requestAnimationFrame(animate3D);
  const t = clock.getElapsedTime();

  controls.update();

  // 太陽アニメーション
  if(sunGroup){
    sunGroup.rotation.y += 0.002;
    const glow = sunGroup.userData.sunGlow;
    const corona = sunGroup.userData.sunCorona;
    if(glow) glow.scale.setScalar(1 + Math.sin(t*2.0)*0.02);
    if(corona) corona.scale.setScalar(1 + Math.sin(t*1.6)*0.04);
  }

  // 地球自転
  if(earthGroup?.userData?.earth){
    earthGroup.userData.earth.rotation.y += 0.004;
  }
  if(cloudMesh){
    cloudMesh.rotation.y += 0.0055;
  }

  // CME進行
  cmeGroup.children.forEach(cme=>{
    cme.userData.progress += cme.userData.speed;
    cme.position.x += cme.userData.speed;

    // 地球通過後もそのまま通り過ぎる
    if(cme.position.x > earthGroup.position.x + 30){
      cme.userData.passedEarth = true;
    }

    // 波面拡大
    cme.scale.setScalar(1 + cme.userData.progress*0.004);

    // 遠くへ行ったら消す
    if(cme.position.x > 340){
      cme.visible = false;
    }
  });

  renderer.render(scene, camera);
}

function onResize3D(){
  const container = document.getElementById("view3d");
  if(!container || !renderer || !camera) return;
  const w = container.clientWidth;
  const h = container.clientHeight;
  renderer.setSize(w,h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
</script>
