name: Update NOAA Wind History

on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Initial/target history length in days. Use 35 for first run."
        required: false
        default: "35"
  schedule:
    # 3時間ごと。初回以降は新しい分だけ追記
    - cron: "07 */3 * * *"

permissions:
  contents: write

jobs:
  update-noaa-wind-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch NOAA solar wind history
        run: |
          python3 <<'PY'
          import json
          import math
          import os
          import time
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          OUT_DIR = Path("docs/data/noaa-wind")
          OUT_DIR.mkdir(parents=True, exist_ok=True)

          HISTORY_PATH = OUT_DIR / "history.json"
          LATEST_PATH = OUT_DIR / "latest.json"
          INDEX_PATH = OUT_DIR / "index.json"

          now = datetime.now(timezone.utc)

          def safe_int(v, default, lo, hi):
              try:
                  n = int(str(v or "").strip())
                  return max(lo, min(hi, n))
              except Exception:
                  return default

          target_days = safe_int(os.environ.get("INPUT_BACKFILL_DAYS"), 35, 7, 60)
          keep_days = max(45, target_days + 10)

          # NOAA SWPCで公開されている期間を広い順に試す。
          # 存在しないURLは自動でskip。初回は取れる範囲を全部、以降はhistoryとmergeして差分追記。
          NOAA_CANDIDATE_URLS = [
              "https://services.swpc.noaa.gov/products/solar-wind/plasma-35-day.json",
              "https://services.swpc.noaa.gov/products/solar-wind/plasma-30-day.json",
              "https://services.swpc.noaa.gov/products/solar-wind/plasma-27-day.json",
              "https://services.swpc.noaa.gov/products/solar-wind/plasma-7-day.json",
              "https://services.swpc.noaa.gov/products/solar-wind/plasma-3-day.json",
              "https://services.swpc.noaa.gov/products/solar-wind/plasma-1-day.json",
              "https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json"
          ]

          def parse_dt(value):
              if not value:
                  return None
              s = str(value).strip()
              if not s:
                  return None
              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"
              try:
                  dt = datetime.fromisoformat(s)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  return None

          def to_float(value, default=None):
              try:
                  if value is None:
                      return default
                  s = str(value).strip()
                  if not s or s.lower() in ("nan", "none", "null"):
                      return default
                  v = float(s)
                  if not math.isfinite(v):
                      return default
                  return v
              except Exception:
                  return default

          def fetch_json(url, timeout=90):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "github-actions-noaa-wind-history",
                      "Accept": "application/json,*/*"
                  }
              )
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode("utf-8", errors="replace"))

          def load_json(path):
              if not path.exists():
                  return None
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception as e:
                  print("JSON read failed:", path, e)
                  return None

          def save_json(path, obj):
              path.write_text(json.dumps(obj, ensure_ascii=False, indent=2), encoding="utf-8")
              print("saved", path)

          def normalize_noaa_wind(data, source_url):
              rows = []
              if not isinstance(data, list) or not data:
                  return rows

              # SWPC products/solar-wind/plasma-X-day.json
              if isinstance(data[0], list):
                  header = [str(x).lower() for x in data[0]]
                  for row in data[1:]:
                      if not isinstance(row, list) or len(row) < 2:
                          continue

                      dt = parse_dt(row[0])
                      if not dt:
                          continue

                      speed = None
                      density = None
                      temperature = None

                      for i, h in enumerate(header):
                          if i >= len(row):
                              continue
                          if "speed" in h:
                              speed = to_float(row[i], speed)
                          elif "density" in h:
                              density = to_float(row[i], density)
                          elif "temperature" in h:
                              temperature = to_float(row[i], temperature)

                      # fallback
                      if speed is None and len(row) >= 3:
                          speed = to_float(row[2], None)

                      if speed is None or speed < 100 or speed > 1400:
                          continue

                      rows.append({
                          "time": dt.isoformat(),
                          "_t": dt.timestamp(),
                          "speed": round(speed, 3),
                          "density": round(density, 3) if density is not None else None,
                          "temperature": round(temperature, 3) if temperature is not None else None,
                          "source": "NOAA_SWPC",
                          "source_url": source_url
                      })

                  return rows

              # SWPC json/rtsw/rtsw_wind_1m.json
              if isinstance(data[0], dict):
                  for r in data:
                      dt = parse_dt(r.get("time_tag") or r.get("time") or r.get("observation_time"))
                      if not dt:
                          continue

                      speed = to_float(r.get("speed") or r.get("proton_speed") or r.get("bulk_speed"))
                      density = to_float(r.get("density") or r.get("proton_density"))
                      temperature = to_float(r.get("temperature"))

                      if speed is None or speed < 100 or speed > 1400:
                          continue

                      rows.append({
                          "time": dt.isoformat(),
                          "_t": dt.timestamp(),
                          "speed": round(speed, 3),
                          "density": round(density, 3) if density is not None else None,
                          "temperature": round(temperature, 3) if temperature is not None else None,
                          "source": "NOAA_RTSW",
                          "source_url": source_url
                      })

              return rows

          old = load_json(HISTORY_PATH) or {"items": []}
          by_time = {}

          for r in old.get("items", []) or []:
              t = r.get("time")
              if t:
                  by_time[t] = r

          fetched_sources = []
          errors = []
          new_count = 0

          for url in NOAA_CANDIDATE_URLS:
              try:
                  print("GET", url)
                  data = fetch_json(url)
                  rows = normalize_noaa_wind(data, url)
                  print("rows", len(rows), "from", url)

                  if not rows:
                      continue

                  fetched_sources.append({
                      "url": url,
                      "rows": len(rows),
                      "start": rows[0]["time"],
                      "end": rows[-1]["time"]
                  })

                  for r in rows:
                      if r["time"] not in by_time:
                          new_count += 1
                      by_time[r["time"]] = r

                  # 7日以上取れた時点で十分。存在しない35/30/27はskipされる。
                  if len(rows) > 1000:
                      break

              except Exception as e:
                  print("skip", url, e)
                  errors.append({"url": url, "error": str(e)})

              time.sleep(1)

          keep_after = now - timedelta(days=keep_days)
          items = []

          for t, r in by_time.items():
              dt = parse_dt(t)
              if dt and dt >= keep_after:
                  items.append(r)

          items.sort(key=lambda x: x["time"])

          history = {
              "updated_at": now.isoformat(),
              "target_days": target_days,
              "keep_days": keep_days,
              "item_count": len(items),
              "new_items_this_run": new_count,
              "coverage": {
                  "start": items[0]["time"] if items else None,
                  "end": items[-1]["time"] if items else None,
                  "days": round((parse_dt(items[-1]["time"]) - parse_dt(items[0]["time"])).total_seconds() / 86400, 3) if len(items) >= 2 else 0
              },
              "fetched_sources": fetched_sources,
              "errors": errors[-20:],
              "items": items
          }

          latest_items = items[-1440:] if len(items) > 1440 else items

          latest = {
              "updated_at": now.isoformat(),
              "source": "NOAA SWPC solar wind plasma products",
              "description": "Accumulated NOAA solar wind observed history for SWIFT Wind AI rotation27 component.",
              "item_count": len(latest_items),
              "coverage": history["coverage"],
              "items": latest_items
          }

          index = {
              "updated_at": now.isoformat(),
              "history": "history.json",
              "latest": "latest.json",
              "coverage": history["coverage"],
              "files": [
                  {
                      "file": "history.json",
                      "path": "./data/noaa-wind/history.json",
                      "size_bytes": 0
                  },
                  {
                      "file": "latest.json",
                      "path": "./data/noaa-wind/latest.json",
                      "size_bytes": 0
                  }
              ]
          }

          save_json(HISTORY_PATH, history)
          save_json(LATEST_PATH, latest)

          index["files"][0]["size_bytes"] = HISTORY_PATH.stat().st_size
          index["files"][1]["size_bytes"] = LATEST_PATH.stat().st_size
          save_json(INDEX_PATH, index)

          print(json.dumps({
              "coverage": history["coverage"],
              "item_count": len(items),
              "new_items_this_run": new_count,
              "fetched_sources": fetched_sources
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/noaa-wind

          git commit -m "Update NOAA solar wind history" || echo "No changes"
          git push
