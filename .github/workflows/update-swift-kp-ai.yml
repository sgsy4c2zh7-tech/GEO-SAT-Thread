name: Update SWIFT Wind AI

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: write

jobs:
  update-swift-wind-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build nonlinear SWIFT wind forecast
        run: |
          python3 <<'PY'
          import json, math, statistics
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          OUT_DIR = Path("docs/data/swift-wind")
          OUT_DIR.mkdir(parents=True, exist_ok=True)
          NOAA_WIND = Path("docs/data/noaa-wind/history.json")
          DONKI = Path("docs/data/donki/latest.json")
          COEF_PATH = OUT_DIR / "coefficients.json"
          LATEST_PATH = OUT_DIR / "latest.json"
          VERIF_PATH = OUT_DIR / "verification.json"
          ARCHIVE_PATH = OUT_DIR / "forecast-archive.json"
          INDEX_PATH = OUT_DIR / "index.json"

          now = datetime.now(timezone.utc)
          forecast_days = 5
          step_hours = 3

          def load_json(path, default=None):
              if not path.exists():
                  return default
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception as e:
                  print("load failed", path, e)
                  return default

          def save_json(path, obj):
              path.write_text(json.dumps(obj, ensure_ascii=False, indent=2), encoding="utf-8")
              print("saved", path)

          def parse_dt(v):
              if not v:
                  return None
              s = str(v).strip()
              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"
              try:
                  d = datetime.fromisoformat(s)
                  if d.tzinfo is None:
                      d = d.replace(tzinfo=timezone.utc)
                  return d.astimezone(timezone.utc)
              except Exception:
                  return None

          def fnum(v, default=None):
              try:
                  if v is None:
                      return default
                  x = float(v)
                  return x if math.isfinite(x) else default
              except Exception:
                  return default

          def clamp(x, lo, hi):
              return max(lo, min(hi, x))

          def median(vals, default=None):
              vals = [fnum(x) for x in vals if fnum(x) is not None]
              return statistics.median(vals) if vals else default

          def sigmoid(x):
              if x > 60: return 1.0
              if x < -60: return 0.0
              return 1/(1+math.exp(-x))

          def get_speed(r):
              return fnum(r.get("speed") or r.get("speed_kms") or r.get("proton_speed") or r.get("v") or r.get("vsw") or r.get("bulk_speed") or r.get("speed_forecast"))

          hist = load_json(NOAA_WIND, {"items": []})
          rows = []
          for r in hist.get("items", []) or []:
              dt = parse_dt(r.get("time"))
              sp = get_speed(r)
              if dt and sp is not None and 200 <= sp <= 1000:
                  rows.append({"time": dt, "speed": sp})
          rows.sort(key=lambda x: x["time"])

          def window(center, hours, source=rows):
              lo = center - timedelta(hours=hours); hi = center + timedelta(hours=hours)
              return [r for r in source if lo <= r["time"] <= hi]

          def before(t, hours, source=rows):
              lo = t - timedelta(hours=hours)
              return [r for r in source if lo <= r["time"] <= t]

          def speed_median(center, hours, default=None):
              return median([r["speed"] for r in window(center, hours)], default)

          def recent_speed():
              recent = before(now, 6)
              return median([r["speed"] for r in recent], 400)

          def recent_trend():
              recent = before(now, 9)
              if len(recent) < 2: return 0.0
              return (median([r["speed"] for r in recent[-2:]], recent[-1]["speed"]) - median([r["speed"] for r in recent[:2]], recent[0]["speed"])) / max(1, (recent[-1]["time"]-recent[0]["time"]).total_seconds()/3600)

          def best_rotation27(t):
              base = t - timedelta(days=27.27)
              candidates = []
              for sh in range(-36, 37, 3):
                  c = base + timedelta(hours=sh)
                  vals = [r["speed"] for r in window(c, 3)]
                  if vals:
                      sp = median(vals)
                      prev = speed_median(c-timedelta(hours=6), 3, sp)
                      nxt = speed_median(c+timedelta(hours=6), 3, sp)
                      grad = (nxt-prev)/12
                      score = 0.8*sigmoid((sp-430)/55) + 0.2*sigmoid(abs(grad)/12) - abs(sh)/120
                      candidates.append((score, sh, sp, grad, len(vals)))
              if not candidates:
                  return None, {"shift_hours": None, "samples": 0}
              best = max(candidates, key=lambda x: x[0])
              return best[2], {"shift_hours": best[1], "gradient_kms_per_h": round(best[3],2), "samples": best[4]}

          def load_donki_events():
              data = load_json(DONKI, {})
              events = []
              def walk(x):
                  if isinstance(x, dict):
                      if any(k in x for k in ("arrival_time","predicted_arrival","estimated_arrival","impact_time","time21_5","startTime","start_time")):
                          events.append(x)
                      for v in x.values(): walk(v)
                  elif isinstance(x, list):
                      for v in x: walk(v)
              walk(data)
              out = []
              for e in events:
                  arr = parse_dt(e.get("arrival_time") or e.get("predicted_arrival") or e.get("estimated_arrival") or e.get("impact_time") or e.get("time21_5"))
                  speed = fnum(e.get("speed") or e.get("arrival_speed") or e.get("cme_speed") or e.get("speed_kms"))
                  half = fnum(e.get("halfAngle") or e.get("half_angle") or e.get("halfAngleDeg"))
                  cls = str(e.get("impact_class") or e.get("impactClass") or e.get("hit_class") or e.get("classification") or "").upper()
                  if arr:
                      out.append({"arrival": arr, "speed": speed, "half_angle": half, "impact_class": cls})
              return out

          cme_events = load_donki_events()

          coef = load_json(COEF_PATH, None) or {
              "version": "SWIFT-Wind-AI-v0.3-nonlinear",
              "updated_at": now.isoformat(),
              "weights": {"recent":0.30,"rotation27":0.45,"trend":0.10,"nonlinear_hss":0.12,"cme":0.03},
              "limits": {"min_speed":280,"max_speed":850,"max_delta_per_3h":55,"ema_alpha":0.58},
              "bias": 0.0,
              "notes": "Nonlinear HSS/CIR model with rotation27 shift search, saturation, and slew-rate limiter for smoother ±50 km/s target."
          }

          def cme_pulse(t):
              val = 0.0; best = None
              for e in cme_events:
                  arr = e.get("arrival")
                  dh = (t-arr).total_seconds()/3600
                  if abs(dh) > 24: continue
                  speed = e.get("speed") or 650; half = e.get("half_angle") or 45; cls = e.get("impact_class") or ""
                  amp = clamp((speed-450)/3.0, 0, 180) + clamp((half-40)*1.2, 0, 70)
                  if "CORE" in cls: amp *= 1.25
                  elif "FLANK" in cls: amp *= 0.65
                  add = amp*math.exp(-(dh/9)**2)
                  val += add
                  if best is None or add > best["pulse"]:
                      best = {"arrival": arr.isoformat(), "speed": speed, "impact_class": cls, "pulse": round(add,1)}
              return clamp(val, 0, 220), best

          def nonlinear_predict_raw(t):
              rec = recent_speed(); trend = recent_trend()
              lead_h = max(0, (t-now).total_seconds()/3600)
              rec_decay = math.exp(-lead_h/18)
              rec_part = rec + clamp(trend * min(lead_h, 12), -70, 70)
              rot, rot_meta = best_rotation27(t)
              if rot is None: rot = rec
              hss_gate = sigmoid((rot-455)/45)
              hss_boost = 120*hss_gate + 25*math.tanh((rot-500)/90)
              quiet_pull = -35*sigmoid((390-rot)/35)
              cme, cme_meta = cme_pulse(t)
              w = coef["weights"]
              pred = (w["recent"]*(rec_part*rec_decay + rec*(1-rec_decay)) + w["rotation27"]*rot + w["trend"]*clamp(trend*12, -80, 80) + w["nonlinear_hss"]*(430+hss_boost+quiet_pull) + w["cme"]*(rec+cme))
              pred += fnum(coef.get("bias"), 0.0)
              pred = clamp(pred, coef["limits"]["min_speed"], coef["limits"]["max_speed"])
              return pred, {"recent":round(rec,1), "trend_kms_per_h":round(trend,2), "rotation27":round(rot,1), "rotation27_meta":rot_meta, "hss_gate":round(hss_gate,3), "cme_pulse":round(cme,1), "nearest_cme":cme_meta}

          def smooth_series(raw):
              if not raw: return []
              lim = coef["limits"]; alpha = fnum(lim.get("ema_alpha"),0.58); max_delta = fnum(lim.get("max_delta_per_3h"),55)
              out=[]; prev=raw[0]["raw_speed"]
              for i,r in enumerate(raw):
                  x = r["raw_speed"]
                  y = x if i==0 else prev + clamp((alpha*x+(1-alpha)*prev)-prev, -max_delta, max_delta)
                  prev = y
                  rr=dict(r); rr["speed"]=round(y,1); rr["speed_raw_nonlinear"]=round(x,1); rr["smoothing"]={"ema_alpha":alpha,"max_delta_per_3h":max_delta}
                  out.append(rr)
              return out

          start = now.replace(minute=0, second=0, microsecond=0)
          start = start.replace(hour=(start.hour//3)*3)
          if start < now: start += timedelta(hours=3)
          raw_forecast=[]
          for i in range(forecast_days*8):
              t = start + timedelta(hours=step_hours*i)
              p, meta = nonlinear_predict_raw(t)
              raw_forecast.append({"time":t.isoformat(),"lead_hours":round((t-now).total_seconds()/3600,1),"raw_speed":p,"features":meta})
          forecast = smooth_series(raw_forecast)

          archive = load_json(ARCHIVE_PATH,{"items":[]}).get("items",[])
          issued_at = now.isoformat()
          for r in forecast:
              archive.append({"issued_at":issued_at,"target_time":r["time"],"lead_hours":r["lead_hours"],"predicted_speed":r["speed"],"scored":False})

          def nearest_obs(t, max_minutes=75):
              best=None; bd=10**18
              for r in rows:
                  d=abs((r["time"]-t).total_seconds())
                  if d<bd: bd=d; best=r
              return best if best and bd<=max_minutes*60 else None

          scored=[]
          for a in archive[-12000:]:
              if a.get("scored"):
                  scored.append(a); continue
              tt=parse_dt(a.get("target_time"))
              if not tt or tt>now:
                  scored.append(a); continue
              obs=nearest_obs(tt)
              if not obs:
                  scored.append(a); continue
              err=fnum(a.get("predicted_speed"),0)-obs["speed"]
              aa=dict(a); aa.update({"scored":True,"observed_speed":round(obs["speed"],2),"error":round(err,2),"abs_error":round(abs(err),2),"hit_50kms":abs(err)<=50,"hit_75kms":abs(err)<=75,"hit_100kms":abs(err)<=100})
              scored.append(aa)

          def metrics(items):
              items=[x for x in items if x.get("scored")]
              if not items: return {"count":0,"status":"learning"}
              errs=[fnum(x["error"],0) for x in items]
              mae=sum(abs(e) for e in errs)/len(errs); bias=sum(errs)/len(errs); rmse=math.sqrt(sum(e*e for e in errs)/len(errs))
              return {"count":len(items),"mae":round(mae,2),"bias":round(bias,2),"rmse":round(rmse,2),"hit_rate_50kms":round(sum(1 for x in items if x.get("hit_50kms"))/len(items)*100,1),"hit_rate_75kms":round(sum(1 for x in items if x.get("hit_75kms"))/len(items)*100,1),"hit_rate_100kms":round(sum(1 for x in items if x.get("hit_100kms"))/len(items)*100,1)}

          def since(days):
              cut=now-timedelta(days=days)
              return [x for x in scored if parse_dt(x.get("target_time")) and parse_dt(x["target_time"])>=cut]
          verification={"updated_at":now.isoformat(),"last_24h":metrics(since(1)),"last_7d":metrics(since(7)),"last_30d":metrics(since(30))}

          v24=verification["last_24h"]
          if v24.get("count",0)>=4 and v24.get("bias") is not None:
              old_bias=fnum(coef.get("bias"),0)
              coef["bias"]=round(clamp(old_bias-0.08*fnum(v24["bias"],0),-80,80),3)
              coef["updated_at"]=now.isoformat()
              coef["last_fit"]={"source":"last_24h_bias","bias_before":old_bias,"observed_bias":v24["bias"],"bias_after":coef["bias"]}

          latest={"updated_at":now.isoformat(),"model":"SWIFT-Wind-AI-v0.3-nonlinear","forecast_days":forecast_days,"step_hours":step_hours,"target":"±50 km/s for 0-24h","forecast":forecast,"current":forecast[0] if forecast else None,"verification":verification,"coefficients":coef,"formula":"Vsw = smooth(limit(nonlinear[recent + shifted rotation27 + HSS sigmoid + CME pulse + bias]))"}
          index={"updated_at":now.isoformat(),"latest":"latest.json","coefficients":"coefficients.json","verification":"verification.json","archive":"forecast-archive.json","files":[]}
          save_json(LATEST_PATH,latest); save_json(COEF_PATH,coef); save_json(VERIF_PATH,verification); save_json(ARCHIVE_PATH,{"updated_at":now.isoformat(),"items":scored[-12000:]})
          for f in sorted(OUT_DIR.glob("*.json")):
              index["files"].append({"file":f.name,"path":f"./data/swift-wind/{f.name}","size_bytes":f.stat().st_size})
          save_json(INDEX_PATH,index)
          print(json.dumps({"current":latest["current"],"verification":verification,"bias":coef.get("bias")},ensure_ascii=False,indent=2))
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/data/swift-wind
          git commit -m "Update nonlinear SWIFT wind forecast" || echo "No changes"
          git push
