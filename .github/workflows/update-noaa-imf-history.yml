name: Update NOAA IMF History

on:
  workflow_dispatch:
  schedule:
    # Bzは変化が速いので3時間ごと。NOAA 7-day productを丸ごと取り直してhistoryへマージ
    - cron: "11 */3 * * *"

permissions:
  contents: write

jobs:
  update-noaa-imf-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch NOAA IMF history
        run: |
          python3 <<'PY'
          import json, math, time, urllib.request
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          OUT_DIR = Path("docs/data/noaa-imf")
          OUT_DIR.mkdir(parents=True, exist_ok=True)

          HISTORY_PATH = OUT_DIR / "history.json"
          LATEST_PATH = OUT_DIR / "latest.json"
          INDEX_PATH = OUT_DIR / "index.json"

          now = datetime.now(timezone.utc)
          keep_days = 120

          NOAA_MAG_URLS = [
              "https://services.swpc.noaa.gov/products/solar-wind/mag-7-day.json",
              "https://services.swpc.noaa.gov/products/solar-wind/mag-1-day.json"
          ]

          def parse_dt(v):
              if not v:
                  return None
              s = str(v).strip()
              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"
              try:
                  d = datetime.fromisoformat(s)
                  if d.tzinfo is None:
                      d = d.replace(tzinfo=timezone.utc)
                  return d.astimezone(timezone.utc)
              except Exception:
                  return None

          def fnum(v, default=None):
              try:
                  if v is None:
                      return default
                  s = str(v).strip()
                  if not s or s.lower() in ("nan","null","none"):
                      return default
                  x = float(s)
                  return x if math.isfinite(x) else default
              except Exception:
                  return default

          def fetch_json(url):
              req = urllib.request.Request(url, headers={"User-Agent":"github-actions-swift-imf-history","Accept":"application/json,*/*"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.loads(r.read().decode("utf-8", errors="replace"))

          def load_json(path):
              if not path.exists():
                  return None
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return None

          def save_json(path, obj):
              path.write_text(json.dumps(obj, ensure_ascii=False, indent=2), encoding="utf-8")
              print("saved", path)

          def normalize_mag(data, source_url):
              rows = []
              if not isinstance(data, list) or not data:
                  return rows

              if isinstance(data[0], list):
                  header = [str(x).lower() for x in data[0]]
                  def idx_any(names):
                      for name in names:
                          for i,h in enumerate(header):
                              if name in h:
                                  return i
                      return None

                  ti = idx_any(["time_tag","time"])
                  bx_i = idx_any(["bx_gsm","bx"])
                  by_i = idx_any(["by_gsm","by"])
                  bz_i = idx_any(["bz_gsm","bz"])
                  bt_i = idx_any(["bt","bt_total","total"])
                  lat_i = idx_any(["lat_gsm","lat"])
                  lon_i = idx_any(["lon_gsm","lon"])

                  if ti is None:
                      ti = 0

                  for row in data[1:]:
                      if not isinstance(row, list) or len(row) <= ti:
                          continue
                      dt = parse_dt(row[ti])
                      if not dt:
                          continue

                      bx = fnum(row[bx_i] if bx_i is not None and bx_i < len(row) else None)
                      by = fnum(row[by_i] if by_i is not None and by_i < len(row) else None)
                      bz = fnum(row[bz_i] if bz_i is not None and bz_i < len(row) else None)
                      bt = fnum(row[bt_i] if bt_i is not None and bt_i < len(row) else None)
                      lat = fnum(row[lat_i] if lat_i is not None and lat_i < len(row) else None)
                      lon = fnum(row[lon_i] if lon_i is not None and lon_i < len(row) else None)

                      if bz is None and by is None and bx is None and bt is None:
                          continue
                      if bt is None:
                          comps = [x for x in (bx, by, bz) if x is not None]
                          if comps:
                              bt = math.sqrt(sum(x*x for x in comps))

                      rows.append({
                          "time": dt.replace(second=0, microsecond=0).isoformat(),
                          "_t": dt.timestamp(),
                          "bt": round(bt, 3) if bt is not None else None,
                          "bx_gsm": round(bx, 3) if bx is not None else None,
                          "by_gsm": round(by, 3) if by is not None else None,
                          "bz_gsm": round(bz, 3) if bz is not None else None,
                          "lat_gsm": round(lat, 3) if lat is not None else None,
                          "lon_gsm": round(lon, 3) if lon is not None else None,
                          "source": "NOAA_SWPC_MAG",
                          "source_url": source_url
                      })

              elif isinstance(data[0], dict):
                  for r in data:
                      dt = parse_dt(r.get("time_tag") or r.get("time"))
                      if not dt:
                          continue
                      bx = fnum(r.get("bx_gsm") or r.get("bx"))
                      by = fnum(r.get("by_gsm") or r.get("by"))
                      bz = fnum(r.get("bz_gsm") or r.get("bz"))
                      bt = fnum(r.get("bt") or r.get("bt_total"))
                      if bz is None and by is None and bx is None and bt is None:
                          continue
                      if bt is None:
                          comps = [x for x in (bx, by, bz) if x is not None]
                          if comps:
                              bt = math.sqrt(sum(x*x for x in comps))
                      rows.append({
                          "time": dt.replace(second=0, microsecond=0).isoformat(),
                          "_t": dt.timestamp(),
                          "bt": round(bt, 3) if bt is not None else None,
                          "bx_gsm": round(bx, 3) if bx is not None else None,
                          "by_gsm": round(by, 3) if by is not None else None,
                          "bz_gsm": round(bz, 3) if bz is not None else None,
                          "lat_gsm": fnum(r.get("lat_gsm") or r.get("lat")),
                          "lon_gsm": fnum(r.get("lon_gsm") or r.get("lon")),
                          "source": "NOAA_SWPC_MAG",
                          "source_url": source_url
                      })

              by_time = {}
              for r in rows:
                  by_time[r["time"]] = r
              out = list(by_time.values())
              out.sort(key=lambda x:x["_t"])
              return out

          old = load_json(HISTORY_PATH) or {"items":[]}
          by_time = {r.get("time"): r for r in old.get("items", []) if r.get("time")}
          before = len(by_time)

          fetched, errors = [], []
          for url in NOAA_MAG_URLS:
              try:
                  print("GET", url)
                  data = fetch_json(url)
                  rows = normalize_mag(data, url)
                  print("rows", len(rows))
                  if rows:
                      fetched.append({"url":url, "rows":len(rows), "start":rows[0]["time"], "end":rows[-1]["time"]})
                      for r in rows:
                          by_time[r["time"]] = r
              except Exception as e:
                  print("skip", url, e)
                  errors.append({"url":url, "error":str(e)})
              time.sleep(1)

          keep_after = now - timedelta(days=keep_days)
          items = []
          for r in by_time.values():
              dt = parse_dt(r.get("time"))
              if dt and dt >= keep_after:
                  items.append(r)
          items.sort(key=lambda x:x["time"])

          latest_after = now - timedelta(days=7)
          latest_items = [r for r in items if parse_dt(r["time"]) >= latest_after]

          coverage = {
              "start": items[0]["time"] if items else None,
              "end": items[-1]["time"] if items else None,
              "days": round((parse_dt(items[-1]["time"]) - parse_dt(items[0]["time"])).total_seconds()/86400, 3) if len(items)>=2 else 0
          }

          history = {
              "updated_at": now.isoformat(),
              "source": "NOAA SWPC solar-wind magnetic-field products",
              "keep_days": keep_days,
              "item_count": len(items),
              "new_items_this_run": max(0, len(by_time)-before),
              "coverage": coverage,
              "fetched_sources": fetched,
              "errors": errors[-20:],
              "items": items
          }

          latest = {
              "updated_at": now.isoformat(),
              "item_count": len(latest_items),
              "coverage": coverage,
              "items": latest_items
          }

          index = {
              "updated_at": now.isoformat(),
              "history": "history.json",
              "latest": "latest.json",
              "coverage": coverage,
              "files": []
          }

          save_json(HISTORY_PATH, history)
          save_json(LATEST_PATH, latest)
          for f in sorted(OUT_DIR.glob("*.json")):
              index["files"].append({"file": f.name, "path": f"./data/noaa-imf/{f.name}", "size_bytes": f.stat().st_size})
          save_json(INDEX_PATH, index)

          print(json.dumps({"coverage": coverage, "items": len(items), "fetched": fetched}, ensure_ascii=False, indent=2))
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/data/noaa-imf
          git commit -m "Update NOAA IMF history" || echo "No changes"
          git push
