name: Update GEO Satellite Anomaly Risk

on:
  workflow_dispatch:
  schedule:
    - cron: "43 * * * *"

permissions:
  contents: write

concurrency:
  group: swift-space-weather-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests sgp4 xlsxwriter

      - name: Build GEO satellite anomaly / risk feed
        # Runs hourly for anomaly/environment data. The Python builder refreshes
        # CelesTrak TLE only once per ~23 h and keeps latest only.
        run: python scripts/build_geo_satellite_anomaly_risk.py

      - name: Build rolling 12-month Excel archive
        run: python scripts/build_satellite_anomaly_monthly_excel.py

      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("docs/data/satellite-risk/latest.json")
          d=json.loads(p.read_text())
          assert d["schema_version"].startswith("SWIFT-GEO-SAT-RISK-v0.4")
          assert "geo_satellites_3d" in d
          assert "scientific_boundary" in d
          assert "tle_cache" in d
          i=Path("docs/data/satellite-risk/monthly-index.json")
          m=json.loads(i.read_text())
          assert m["retention_months"] == 12
          assert len(m["reports"]) == 12
          print("OK", d["generated_at"], len(d["geo_satellites_3d"]), len(m["reports"]), d["tle_cache"])
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/satellite-risk
          if git diff --cached --quiet; then
            echo "No satellite-risk changes."
            exit 0
          fi
          git commit -m "Update GEO satellite anomaly risk and monthly Excel"
          for i in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i*5))
          done
          exit 1
