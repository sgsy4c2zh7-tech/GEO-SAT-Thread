name: Update SWIFT Wind AI

on:
  workflow_dispatch:
  schedule:
    - cron: "28 */3 * * *"

permissions:
  contents: write

concurrency:
  group: update-swift-wind-ai
  cancel-in-progress: false

jobs:
  update-swift-wind-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required files
        run: |
          test -f requirements-report.txt
          test -f scripts/update_noaa_space_weather_history.py
          test -f scripts/learn_cme_wind_boost.py
          test -f scripts/build_swift_wind_ai.py
          echo "Wind-AI required files found."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-report.txt ]; then
            pip install -r requirements-report.txt
          else
            pip install requests
          fi

      - name: Update NOAA solar-wind history
        run: python scripts/update_noaa_space_weather_history.py

      - name: Learn CME wind speed increase
        run: python scripts/learn_cme_wind_boost.py

      - name: Build SWIFT Wind AI records and forecast
        run: python scripts/build_swift_wind_ai.py

      - name: Validate SWIFT Wind AI output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("docs/data/swift-wind/latest.json")
          x=json.loads(p.read_text(encoding="utf-8"))
          records=x.get("records") or []
          forecast=x.get("forecast") or []
          assert records, "latest.json.records is empty"
          assert forecast, "latest.json.forecast is empty"
          print("model:", x.get("model"))
          print("records:", len(records))
          print("forecast:", len(forecast))
          PY

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add docs/data/noaa docs/data/noaa_wind_history.json docs/data/noaa_imf_history.json docs/data/noaa_kp_history.json docs/data/cme-arrivals docs/data/swift-wind || true
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Fix and update SWIFT Wind AI"
            git push
          fi
