name: Update SWIFT AI Pipeline v0.8

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: swift-space-weather-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31.0" "xlsxwriter>=3.2.0"
      - name: Update NOAA accumulated history
        run: python scripts/update_noaa_space_weather_history.py
      - name: Learn CME wind boost
        run: python scripts/learn_cme_wind_boost.py
      - name: Build SWIFT Wind AI
        run: python scripts/build_swift_wind_ai.py
      - name: Build SWIFT Bz AI
        run: python scripts/build_swift_bz_ai.py
      - name: Build SWIFT Kp AI v0.8
        run: python scripts/build_swift_kp_ai.py
      - name: Build monthly Excel and UI feed
        run: python scripts/build_swift_monthly_excel_report.py
      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required=[
            'docs/data/noaa/wind_history.json','docs/data/noaa/mag_history.json','docs/data/noaa/kp_history.json',
            'docs/data/swift-wind/latest.json','docs/data/swift-wind/forecast-archive.json',
            'docs/data/swift-bz/latest.json','docs/data/swift-kp/latest.json',
            'docs/reports/index.json','docs/reports/ui_forecast_latest.json']
          for s in required:
            p=Path(s); assert p.exists() and p.stat().st_size>0, f'missing {p}'
          kp=json.loads(Path('docs/data/swift-kp/latest.json').read_text())
          assert kp.get('forecast_hours')==72, kp.get('forecast_hours')
          assert all(float(x.get('kp',0))>=0.33 for x in kp.get('forecast',[]))
          print('Kp model',kp.get('model'),'rows',len(kp.get('forecast',[])))
          PY
      - name: Commit and push safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/reports || true
          if git diff --cached --quiet; then echo "No generated changes."; exit 0; fi
          git commit -m "Update SWIFT v0.8 AI and monthly report"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
