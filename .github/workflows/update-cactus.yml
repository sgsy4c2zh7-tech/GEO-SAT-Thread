name: Update CACTus Cache

on:
  workflow_dispatch:
  schedule:
    # 3時間ごと
    - cron: "11 */3 * * *"

permissions:
  contents: write

jobs:
  update-cactus:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch CACTus CME data
        run: |
          python3 <<'PY'
          import json
          import re
          import time
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          OUT_DIR = Path("docs/data/cactus")
          OUT_DIR.mkdir(parents=True, exist_ok=True)

          now = datetime.now(timezone.utc)
          stamp = now.strftime("%Y-%m-%dT%H00Z")

          retention_days = 14
          max_files = 130

          source_url = "https://www.sidc.be/cactus/out/latestCMEs.html"

          def fetch_text(url, tries=4):
              last_error = None

              for i in range(tries):
                  try:
                      print("GET", url)

                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "github-actions-cactus-cache",
                              "Accept": "text/html,text/plain,*/*"
                          }
                      )

                      with urllib.request.urlopen(req, timeout=120) as r:
                          text = r.read().decode("utf-8", errors="replace")
                          print("HTTP", r.status, "len", len(text))
                          return text, None

                  except Exception as e:
                      last_error = str(e)
                      wait = 20 * (i + 1)
                      print(f"retry {i+1}/{tries} failed: {e}; wait {wait}s")
                      time.sleep(wait)

              return "", last_error

          def parse_cactus_time(value):
              s = str(value or "").strip()

              m = re.search(r"(\d{4})/(\d{2})/(\d{2})\s+(\d{2}):(\d{2})", s)

              if not m:
                  return None

              return datetime(
                  int(m.group(1)),
                  int(m.group(2)),
                  int(m.group(3)),
                  int(m.group(4)),
                  int(m.group(5)),
                  tzinfo=timezone.utc
              )

          def strip_html(html):
              text = re.sub(r"(?i)<br\s*/?>", "\n", html)
              text = re.sub(r"(?i)</tr>", "\n", text)
              text = re.sub(r"(?i)</p>", "\n", text)
              text = re.sub(r"<[^>]+>", " ", text)

              text = text.replace("&nbsp;", " ")
              text = text.replace("&gt;", ">")
              text = text.replace("&lt;", "<")
              text = text.replace("&amp;", "&")

              return text

          def parse_cactus_events(html):
              text = strip_html(html)

              lines = [
                  x.strip()
                  for x in text.splitlines()
                  if x.strip()
              ]

              events = []
              seen = set()

              # CACTus latestCMEs.html の縦棒区切り想定
              # 例:
              # 1234 | 2026/06/12 03:24 | ... | PA | DA | speed | ...
              pat = re.compile(
                  r"^(\d{3,6})\s*\|\s*"
                  r"(\d{4}/\d{2}/\d{2}\s+\d{2}:\d{2})\s*\|\s*"
                  r"(\d+)\s*\|\s*"
                  r"(\d+)\s*\|\s*"
                  r"(\d+)\s*\|\s*"
                  r"(\d+)\s*\|\s*"
                  r"(\d+)\s*\|\s*"
                  r"(\d+)\s*\|\s*"
                  r"(\d+)\s*\|\s*"
                  r"([IVX]*)"
              )

              for line in lines:
                  m = pat.search(line)

                  if not m:
                      continue

                  event_id = f"CACTus-{m.group(1)}"
                  dt = parse_cactus_time(m.group(2))

                  if not dt:
                      continue

                  try:
                      pa = int(m.group(4))
                      da = int(m.group(5))
                      speed = int(m.group(6))
                  except Exception:
                      pa = None
                      da = None
                      speed = None

                  key = (event_id, dt.isoformat())

                  if key in seen:
                      continue

                  seen.add(key)

                  events.append({
                      "id": event_id,
                      "source": "CACTus",
                      "time": dt.isoformat(),
                      "t0": dt.isoformat(),
                      "pa": pa,
                      "da": da,
                      "speed": speed,
                      "halo": m.group(10) or "",
                      "raw_line": line[:500]
                  })

              events.sort(key=lambda x: x["time"], reverse=True)

              return events

          html, err = fetch_text(source_url)

          events = parse_cactus_events(html) if html else []

          payload = {
              "generated_at": now.isoformat(),
              "stamp": stamp,
              "source": "CACTus SIDC",
              "source_url": source_url,
              "retention_days": retention_days,
              "ok": err is None,
              "error": err,
              "event_count": len(events),
              "events": events,
              "raw_excerpt": html[:3000] if html else ""
          }

          out_file = OUT_DIR / f"{stamp}.json"
          out_file.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Saved:", out_file)

          latest_file = OUT_DIR / "latest.json"

          if events or err is None:
              latest_file.write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2),
                  encoding="utf-8"
              )
              print("Saved:", latest_file)
          elif latest_file.exists():
              old = json.loads(latest_file.read_text(encoding="utf-8"))
              old["last_update_error"] = err
              old["last_failed_at"] = now.isoformat()

              latest_file.write_text(
                  json.dumps(old, ensure_ascii=False, indent=2),
                  encoding="utf-8"
              )

          cutoff = now - timedelta(days=retention_days)

          # 古いsnapshot削除
          for f in OUT_DIR.glob("*.json"):
              if f.name in ("index.json", "latest.json"):
                  continue

              delete = False

              try:
                  dt = datetime.strptime(f.stem, "%Y-%m-%dT%H00Z").replace(tzinfo=timezone.utc)
                  if dt < cutoff:
                      delete = True
              except Exception:
                  pass

              if delete:
                  print("Delete old:", f)
                  f.unlink()

          snapshots = sorted(
              [
                  f for f in OUT_DIR.glob("*.json")
                  if f.name not in ("index.json", "latest.json")
              ],
              reverse=True
          )

          for f in snapshots[max_files:]:
              print("Delete overflow:", f)
              f.unlink()

          # indexは保持期間内の全snapshotからイベントをマージ
          files = []
          merged = {}

          for f in sorted(
              [
                  x for x in OUT_DIR.glob("*.json")
                  if x.name != "index.json"
              ],
              reverse=True
          ):
              try:
                  item = json.loads(f.read_text(encoding="utf-8"))

                  files.append({
                      "stamp": item.get("stamp") or f.stem,
                      "file": f.name,
                      "path": f"./data/cactus/{f.name}",
                      "generated_at": item.get("generated_at"),
                      "valid": bool(item.get("ok")),
                      "event_count": int(item.get("event_count") or len(item.get("events") or [])),
                      "error": item.get("error")
                  })

                  for ev in item.get("events") or []:
                      t = ev.get("time") or ev.get("t0")

                      if not t:
                          continue

                      try:
                          dt = datetime.fromisoformat(t.replace("Z", "+00:00"))

                          if dt.tzinfo is None:
                              dt = dt.replace(tzinfo=timezone.utc)

                          dt = dt.astimezone(timezone.utc)

                      except Exception:
                          continue

                      if dt < cutoff:
                          continue

                      key = f"{ev.get('id','CACTus')}_{dt.isoformat()}"

                      merged[key] = ev

              except Exception as e:
                  files.append({
                      "stamp": f.stem,
                      "file": f.name,
                      "path": f"./data/cactus/{f.name}",
                      "valid": False,
                      "error": str(e)
                  })

          merged_events = list(merged.values())
          merged_events.sort(
              key=lambda x: x.get("time", x.get("t0", "")),
              reverse=True
          )

          index = {
              "updated_at": now.isoformat(),
              "source": "CACTus SIDC",
              "source_url": source_url,
              "latest": "latest.json" if latest_file.exists() else None,
              "last_attempt": out_file.name,
              "retention_days": retention_days,
              "event_count": len(merged_events),
              "events": merged_events,
              "files": files
          }

          index_file = OUT_DIR / "index.json"
          index_file.write_text(
              json.dumps(index, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Saved:", index_file)
          print(json.dumps({
              "event_count": len(merged_events),
              "files": len(files),
              "latest_events": len(events),
              "error": err
          }, ensure_ascii=False, indent=2))

          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/cactus

          git commit -m "Update CACTus cache" || echo "No changes"
          git push