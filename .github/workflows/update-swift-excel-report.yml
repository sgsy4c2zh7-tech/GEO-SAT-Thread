              write_table(ws, 0, 0, ["UTC", "Bz_Forecast_nT", "Bz_Min_Forecast_nT", "Bt_Forecast_nT", "Southward_Probability_pct", "Risk", "CME_ID"], bz_rows, fmt)
              ws.set_column("A:A", 19); ws.set_column("B:E", 22); ws.set_column("F:G", 24)
