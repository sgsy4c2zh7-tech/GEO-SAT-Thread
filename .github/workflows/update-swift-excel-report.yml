          def interpolate_wsa(wsa: list[dict[str, Any]], t: datetime) -> float | None:
              if not wsa:
                  return None
              if t <= wsa[0]["time"]:
                  return wsa[0]["speed"]
              if t >= wsa[-1]["time"]:
                  return wsa[-1]["speed"]
              prev = wsa[0]
              for nxt in wsa[1:]:
                  if prev["time"] <= t <= nxt["time"]:
                      den = (nxt["time"] - prev["time"]).total_seconds()
                      if den <= 0:
                          return prev["speed"]
                      f = (t - prev["time"]).total_seconds() / den
                      return prev["speed"] + (nxt["speed"] - prev["speed"]) * f
