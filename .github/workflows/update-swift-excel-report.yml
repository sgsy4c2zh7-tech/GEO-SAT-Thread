          import json
          from pathlib import Path

          required = [
              Path("docs/data/swift-wind/latest.json"),
              Path("docs/data/swift-bz/latest.json"),
              Path("docs/reports/swift_space_weather_report_latest.xlsx"),
          ]
          for p in required:
              assert p.exists() and p.stat().st_size > 0, f"missing output: {p}"

          wind=json.loads(Path("docs/data/swift-wind/latest.json").read_text(encoding="utf-8"))
          records=wind.get("records") or []
          forecast=wind.get("forecast") or []
          assert records, "SWIFT Wind AI records is empty"
          assert forecast, "SWIFT Wind AI forecast is empty"
          print("Wind model:", wind.get("model"))
          print("Wind records:", len(records))
          print("Wind forecast:", len(forecast))
          print("Excel bytes:", Path("docs/reports/swift_space_weather_report_latest.xlsx").stat().st_size)
          PY

      - name: Remove transient embedded scripts
        run: |
          rm -f scripts/update_noaa_space_weather_history.py
          rm -f scripts/learn_cme_wind_boost.py
          rm -f scripts/build_swift_wind_ai.py
          rm -f scripts/build_swift_bz_ai.py
          rm -f scripts/build_swift_excel_report.py

      - name: Commit generated data and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add docs/data docs/reports reports || true
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Update SWIFT space-weather AI and Excel report"
            git push
          fi
