                  dt = abs((t - arrival).total_seconds()) / 3600.0
                  if dt > 24:
                      continue
                  amp = num(c.get("expected_wind_speed_increase"), 0.0) or 0.0
                  shape = math.exp(-(dt / 9.0) ** 2)
                  v = amp * shape
                  if v > best:
                      best = v
                      best_id = c.get("id")
              return round(best, 2), best_id
          
          
