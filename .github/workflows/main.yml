name: Update WSA Solar Wind Cache

on:
  workflow_dispatch:
  schedule:
    # 1日1回 UTC 02:00 / 日本時間 11:00
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  update-wsa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch WSA solar wind model
        env:
          # 例:
          # https://example.nasa.gov/wsa/api?start={start}&end={end}
          # {start} と {end} があれば自動置換
          WSA_API_URL: ${{ secrets.WSA_API_URL }}

          # APIキーが必要な場合だけ設定
          WSA_API_KEY: ${{ secrets.WSA_API_KEY }}
        run: |
          python3 <<'PY'
          import os
          import re
          import csv
          import json
          import time
          import urllib.request
          from io import StringIO
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          # =========================
          # Settings
          # =========================
          base_dir = Path("docs/data/wsa")
          base_dir.mkdir(parents=True, exist_ok=True)

          now = datetime.now(timezone.utc)
          today = now.strftime("%Y-%m-%d")

          history_days = 27
          retention_days = 35

          start_dt = now - timedelta(days=history_days)
          end_dt = now

          start = start_dt.strftime("%Y-%m-%d")
          end = end_dt.strftime("%Y-%m-%d")

          url_template = os.environ.get("WSA_API_URL", "").strip()
          api_key = os.environ.get("WSA_API_KEY", "").strip()

          if not url_template:
              raise SystemExit(
                  "WSA_API_URL is not set. Add it to GitHub Secrets or Variables. "
                  "Example: https://.../api?start={start}&end={end}"
              )

          # =========================
          # URL builder
          # =========================
          def build_url(template):
              url = template.replace("{start}", start).replace("{end}", end)

              if api_key:
                  if "{api_key}" in url:
                      url = url.replace("{api_key}", api_key)
                  else:
                      sep = "&" if "?" in url else "?"
                      url = f"{url}{sep}api_key={api_key}"

              return url

          url = build_url(url_template)

          print("WSA start:", start)
          print("WSA end:", end)
          print("WSA URL:", url.replace(api_key, "***") if api_key else url)

          # =========================
          # Fetch
          # =========================
          def fetch_text(url, tries=5, timeout=120):
              last = None

              for i in range(tries):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "wsa-cache-github-actions",
                              "Accept": "application/json,text/csv,text/plain,*/*"
                          }
                      )

                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          text = r.read().decode("utf-8", errors="replace")
                          print("HTTP status:", r.status)
                          print("Response head:", text[:300].replace("\n", " "))
                          return text

                  except Exception as e:
                      last = e
                      wait = 20 * (i + 1)
                      print(f"Retry {i+1}/{tries} failed: {e}")
                      print(f"Waiting {wait} sec...")
                      time.sleep(wait)

              raise last

          text = fetch_text(url)

          # =========================
          # Flexible parser
          # =========================
          time_keys = [
              "time", "time_tag", "datetime", "date", "timestamp",
              "utc", "model_time", "valid_time"
          ]

          speed_keys = [
              "speed", "v", "vr", "solar_wind_speed", "wind_speed",
              "velocity", "v_sw", "V", "Vsw"
          ]

          density_keys = [
              "density", "n", "np", "proton_density", "solar_wind_density"
          ]

          bt_keys = ["bt", "b", "b_total", "magnetic_field", "B"]
          bz_keys = ["bz", "Bz", "bz_gsm", "Bz_gsm"]

          def find_value(d, keys):
              if not isinstance(d, dict):
                  return None

              lower = {str(k).lower(): v for k, v in d.items()}

              for k in keys:
                  if k in d:
                      return d[k]
                  lk = str(k).lower()
                  if lk in lower:
                      return lower[lk]

              return None

          def to_float(x):
              try:
                  if x is None:
                      return None
                  s = str(x).strip()
                  if s == "" or s.lower() in ("nan", "none", "null"):
                      return None
                  return float(s)
              except Exception:
                  return None

          def normalize_time(x):
              if x is None:
                  return None

              s = str(x).strip()

              # Unix epoch seconds
              if re.fullmatch(r"\d{10}", s):
                  return datetime.fromtimestamp(int(s), tz=timezone.utc).isoformat()

              # Unix epoch milliseconds
              if re.fullmatch(r"\d{13}", s):
                  return datetime.fromtimestamp(int(s) / 1000, tz=timezone.utc).isoformat()

              # ISO-ish
              s = s.replace("Z", "+00:00")

              try:
                  dt = datetime.fromisoformat(s)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc).isoformat()
              except Exception:
                  pass

              # Common format: YYYY-MM-DD HH:MM
              for fmt in ("%Y-%m-%d %H:%M", "%Y/%m/%d %H:%M", "%Y-%m-%d %H:%M:%S", "%Y/%m/%d %H:%M:%S"):
                  try:
                      dt = datetime.strptime(s, fmt).replace(tzinfo=timezone.utc)
                      return dt.isoformat()
                  except Exception:
                      pass

              return None

          def flatten_json(obj):
              if isinstance(obj, list):
                  return obj

              if isinstance(obj, dict):
                  for key in ("records", "data", "results", "items", "values", "wind", "solar_wind"):
                      if isinstance(obj.get(key), list):
                          return obj[key]

                  # dict of time -> values
                  rows = []
                  for k, v in obj.items():
                      if isinstance(v, dict):
                          row = {"time": k}
                          row.update(v)
                          rows.append(row)
                  if rows:
                      return rows

              return []

          def parse_json(text):
              obj = json.loads(text)
              rows = flatten_json(obj)
              return rows, obj

          def parse_csv_text(text):
              # delimiter auto-ish
              sample = text[:2000]
              dialect = csv.Sniffer().sniff(sample, delimiters=",\t; |")
              reader = csv.DictReader(StringIO(text), dialect=dialect)
              rows = list(reader)
              return rows

          def normalize_rows(rows):
              records = []

              for row in rows:
                  if not isinstance(row, dict):
                      continue

                  t_raw = find_value(row, time_keys)
                  t = normalize_time(t_raw)
                  speed = to_float(find_value(row, speed_keys))

                  if not t or speed is None:
                      continue

                  density = to_float(find_value(row, density_keys))
                  bt = to_float(find_value(row, bt_keys))
                  bz = to_float(find_value(row, bz_keys))

                  # 常識的な範囲だけ採用
                  if speed < 150 or speed > 1200:
                      continue

                  rec = {
                      "time": t,
                      "speed": round(speed, 2)
                  }

                  if density is not None:
                      rec["density"] = round(density, 3)
                  if bt is not None:
                      rec["bt"] = round(bt, 3)
                  if bz is not None:
                      rec["bz"] = round(bz, 3)

                  records.append(rec)

              records.sort(key=lambda x: x["time"])

              # 重複時刻を削除
              dedup = {}
              for r in records:
                  dedup[r["time"]] = r

              return list(dedup.values())

          raw_obj = None

          try:
              rows, raw_obj = parse_json(text)
              records = normalize_rows(rows)
              parser = "json"
          except Exception:
              rows = parse_csv_text(text)
              records = normalize_rows(rows)
              parser = "csv"

          if not records:
              raise SystemExit("No valid WSA records parsed. Check WSA_API_URL response format.")

          print("Parser:", parser)
          print("Records:", len(records))
          print("First:", records[0])
          print("Last:", records[-1])

          # =========================
          # Save files
          # =========================
          daily_payload = {
              "generated_at": now.isoformat(),
              "source": "WSA Dashboard / NASA CCMC",
              "parser": parser,
              "startDate": start,
              "endDate": end,
              "history_days": history_days,
              "record_count": len(records),
              "records": records
          }

          daily_file = base_dir / f"{today}.json"
          latest_file = base_dir / "latest.json"
          history_file = base_dir / "history-27d.json"

          daily_file.write_text(json.dumps(daily_payload, ensure_ascii=False, indent=2), encoding="utf-8")
          latest_file.write_text(json.dumps(daily_payload, ensure_ascii=False, indent=2), encoding="utf-8")
          history_file.write_text(json.dumps(daily_payload, ensure_ascii=False, indent=2), encoding="utf-8")

          # =========================
          # Retention
          # =========================
          keep_dates = {
              (now - timedelta(days=i)).strftime("%Y-%m-%d")
              for i in range(retention_days)
          }

          for f in base_dir.glob("*.json"):
              if f.name in ("index.json", "latest.json", "history-27d.json"):
                  continue
              if f.stem not in keep_dates:
                  print("Delete old file:", f)
                  f.unlink()

          all_files = sorted(
              [
                  f for f in base_dir.glob("*.json")
                  if f.name not in ("index.json", "latest.json", "history-27d.json")
              ],
              reverse=True
          )

          file_entries = []

          for f in all_files:
              try:
                  obj = json.loads(f.read_text(encoding="utf-8"))
                  file_entries.append({
                      "date": f.stem,
                      "file": f.name,
                      "path": f"./data/wsa/{f.name}",
                      "generated_at": obj.get("generated_at"),
                      "startDate": obj.get("startDate"),
                      "endDate": obj.get("endDate"),
                      "record_count": obj.get("record_count", 0)
                  })
              except Exception as e:
                  file_entries.append({
                      "date": f.stem,
                      "file": f.name,
                      "path": f"./data/wsa/{f.name}",
                      "error": str(e)
                  })

          index = {
              "updated_at": now.isoformat(),
              "source": "WSA Dashboard / NASA CCMC",
              "history_days": history_days,
              "retention_days": retention_days,
              "latest": "latest.json",
              "history": "history-27d.json",
              "files": file_entries
          }

          (base_dir / "index.json").write_text(
              json.dumps(index, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Saved:")
          print(daily_file)
          print(latest_file)
          print(history_file)
          print(base_dir / "index.json")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/wsa

          git commit -m "Update WSA solar wind cache" || echo "No changes"
          git push