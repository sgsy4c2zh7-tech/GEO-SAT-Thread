name: Update DONKI Cache

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  update-donki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch DONKI CMEAnalysis only
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          python3 <<'PY'
          import os
          import json
          import time
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          api_key = os.environ.get("NASA_API_KEY", "")
          if not api_key:
              raise SystemExit("NASA_API_KEY is not set")

          base_dir = Path("docs/data/donki")
          base_dir.mkdir(parents=True, exist_ok=True)

          now = datetime.now(timezone.utc)
          today = now.strftime("%Y-%m-%d")

          start = (now - timedelta(days=7)).strftime("%Y-%m-%d")
          end = now.strftime("%Y-%m-%d")

          url = (
              "https://api.nasa.gov/DONKI/CMEAnalysis"
              f"?startDate={start}&endDate={end}"
              f"&mostAccurateOnly=true"
              f"&speed=300"
              f"&api_key={api_key}"
          )

          def fetch_json(url, tries=8):
              last_error = None

              for i in range(tries):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "donki-cache-github-actions",
                              "Accept": "application/json"
                          }
                      )

                      with urllib.request.urlopen(req, timeout=90) as r:
                          return json.loads(r.read().decode("utf-8"))

                  except Exception as e:
                      last_error = e
                      wait = 20 * (i + 1)
                      print(f"Retry {i+1}/{tries} failed: {e}")
                      time.sleep(wait)

              raise last_error

          payload = {
              "generated_at": now.isoformat(),
              "startDate": start,
              "endDate": end,
              "any_ok": False,
              "sources": {
                  "cmeAnalysis": {
                      "ok": False,
                      "error": None,
                      "data": []
                  },
                  "cme": {
                      "ok": False,
                      "skipped": True,
                      "data": []
                  },
                  "sep": {
                      "ok": False,
                      "skipped": True,
                      "data": []
                  },
                  "flr": {
                      "ok": False,
                      "skipped": True,
                      "data": []
                  }
              }
          }

          try:
              data = fetch_json(url)
              payload["sources"]["cmeAnalysis"] = {
                  "ok": True,
                  "count": len(data) if isinstance(data, list) else 1,
                  "data": data
              }
              payload["any_ok"] = True

          except Exception as e:
              payload["sources"]["cmeAnalysis"] = {
                  "ok": False,
                  "error": str(e),
                  "data": []
              }

          out_file = base_dir / f"{today}.json"
          out_file.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          keep_dates = {
              (now - timedelta(days=i)).strftime("%Y-%m-%d")
              for i in range(7)
          }

          for f in base_dir.glob("*.json"):
              if f.name == "index.json":
                  continue
              if f.stem not in keep_dates:
                  f.unlink()

          all_files = sorted(
              [f for f in base_dir.glob("*.json") if f.name != "index.json"],
              reverse=True
          )

          valid_files = []

          for f in all_files:
              try:
                  obj = json.loads(f.read_text(encoding="utf-8"))
                  if obj.get("any_ok"):
                      valid_files.append(f)
              except Exception:
                  pass

          latest_file = valid_files[0].name if valid_files else None

          index = {
              "updated_at": now.isoformat(),
              "retention_days": 7,
              "latest": latest_file,
              "last_attempt": f"{today}.json",
              "latest_policy": "Use latest successful DONKI cache only",
              "files": [
                  {
                      "date": f.stem,
                      "path": f"./data/donki/{f.name}",
                      "valid": f in valid_files
                  }
                  for f in all_files
              ]
          }

          (base_dir / "index.json").write_text(
              json.dumps(index, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print(json.dumps(index, indent=2))
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/data/donki
          git commit -m "Update DONKI cache" || echo "No changes"
          git push