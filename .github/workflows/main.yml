name: Update DONKI Cache

on:
  workflow_dispatch:
  schedule:
    # 3時間ごとに実行 UTC
    # 日本時間: 09,12,15,18,21,00,03,06時
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  update-donki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch DONKI and update cache
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          python3 <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.error
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          api_key = os.environ.get("NASA_API_KEY", "").strip()

          if not api_key:
              raise SystemExit("NASA_API_KEY is not set")

          print("NASA_API_KEY exists: true")
          print("NASA_API_KEY length:", len(api_key))

          # =========================
          # Settings
          # =========================
          base_dir = Path("docs/data/donki")
          base_dir.mkdir(parents=True, exist_ok=True)

          now = datetime.now(timezone.utc)

          # 3時間ごとなので時刻付きファイル名にする
          stamp = now.strftime("%Y-%m-%dT%H00Z")

          # DONKI取得範囲
          # 3時間ごとに回すが、DONKI側の登録遅れを考えて過去3日を毎回取得
          fetch_days = 3

          # 3時間ごと × 7日 = 56ファイル保持
          max_files = 56

          start = (now - timedelta(days=fetch_days)).strftime("%Y-%m-%d")
          end = now.strftime("%Y-%m-%d")

          print("DONKI startDate:", start)
          print("DONKI endDate:", end)
          print("Cache stamp:", stamp)
          print("Max cache files:", max_files)

          # =========================
          # Fetch helpers
          # =========================
          def fetch_text(url, tries=5, timeout=90):
              last_error = None

              for i in range(tries):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "donki-cache-github-actions",
                              "Accept": "application/json"
                          }
                      )

                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          text = r.read().decode("utf-8")
                          print("HTTP status:", r.status)
                          return text

                  except Exception as e:
                      last_error = e
                      wait = 20 * (i + 1)
                      print(f"Retry {i+1}/{tries} failed: {e}")
                      print(f"Waiting {wait} sec...")
                      time.sleep(wait)

              raise last_error

          def fetch_json(url, tries=5):
              text = fetch_text(url, tries=tries)

              try:
                  return json.loads(text)
              except Exception:
                  print("Response text head:")
                  print(text[:500])
                  raise

          # =========================
          # NASA API key test
          # =========================
          apod_ok = False
          apod_error = None

          try:
              print("")
              print("Testing NASA API key with APOD...")
              apod_url = f"https://api.nasa.gov/planetary/apod?api_key={api_key}"
              apod = fetch_json(apod_url, tries=2)
              apod_ok = True
              print("APOD API key test: OK")
              if isinstance(apod, dict):
                  print("APOD title:", apod.get("title", "no title"))
          except Exception as e:
              apod_error = str(e)
              print("APOD API key test: FAILED")
              print("APOD error:", apod_error)

          # =========================
          # DONKI URLs
          # =========================
          urls = {
              "cmeAnalysis": (
                  "https://api.nasa.gov/DONKI/CMEAnalysis"
                  f"?startDate={start}&endDate={end}"
                  f"&mostAccurateOnly=true"
                  f"&speed=300"
                  f"&api_key={api_key}"
              ),
              "cme": (
                  "https://api.nasa.gov/DONKI/CME"
                  f"?startDate={start}&endDate={end}"
                  f"&api_key={api_key}"
              ),
              "sep": (
                  "https://api.nasa.gov/DONKI/SEP"
                  f"?startDate={start}&endDate={end}"
                  f"&api_key={api_key}"
              ),
              "flr": (
                  "https://api.nasa.gov/DONKI/FLR"
                  f"?startDate={start}&endDate={end}"
                  f"&api_key={api_key}"
              )
          }

          payload = {
              "generated_at": now.isoformat(),
              "stamp": stamp,
              "startDate": start,
              "endDate": end,
              "fetch_days": fetch_days,
              "max_files": max_files,
              "schedule": "every 3 hours",
              "api_key_test": {
                  "apod_ok": apod_ok,
                  "apod_error": apod_error
              },
              "any_ok": False,
              "sources": {}
          }

          # =========================
          # Fetch DONKI
          # =========================
          for name, url in urls.items():
              print("")
              print("Fetching:", name)
              print("URL:", url.replace(api_key, "***"))

              try:
                  data = fetch_json(url, tries=5)

                  count = len(data) if isinstance(data, list) else 1

                  payload["sources"][name] = {
                      "ok": True,
                      "count": count,
                      "data": data
                  }

                  payload["any_ok"] = True

                  print(f"{name}: OK, count={count}")

              except Exception as e:
                  payload["sources"][name] = {
                      "ok": False,
                      "error": str(e),
                      "data": []
                  }

                  print(f"{name}: FAILED")
                  print(str(e))

          # =========================
          # Save current attempt
          # =========================
          out_file = base_dir / f"{stamp}.json"
          out_file.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("")
          print("Saved:", out_file)

          # =========================
          # Retention: keep latest 56 files
          # =========================
          all_cache_files = sorted(
              [f for f in base_dir.glob("*.json") if f.name != "index.json"],
              reverse=True
          )

          for f in all_cache_files[max_files:]:
              print("Delete old file:", f)
              f.unlink()

          # Re-read after deletion
          all_cache_files = sorted(
              [f for f in base_dir.glob("*.json") if f.name != "index.json"],
              reverse=True
          )

          # =========================
          # Build index.json
          # =========================
          valid_files = []
          file_entries = []

          for f in all_cache_files:
              valid = False
              any_ok = False
              counts = {}
              generated_at = None
              start_date = None
              end_date = None
              stamp_value = f.stem

              try:
                  obj = json.loads(f.read_text(encoding="utf-8"))

                  generated_at = obj.get("generated_at")
                  start_date = obj.get("startDate")
                  end_date = obj.get("endDate")
                  stamp_value = obj.get("stamp", f.stem)
                  any_ok = bool(obj.get("any_ok"))

                  for source_name, source_obj in obj.get("sources", {}).items():
                      if source_obj.get("ok"):
                          counts[source_name] = source_obj.get("count", 0)
                      else:
                          counts[source_name] = 0

                  if any_ok:
                      valid = True
                      valid_files.append(f)

              except Exception as e:
                  print("Failed to inspect:", f, e)

              file_entries.append({
                  "stamp": stamp_value,
                  "file": f.name,
                  "path": f"./data/donki/{f.name}",
                  "valid": valid,
                  "any_ok": any_ok,
                  "generated_at": generated_at,
                  "startDate": start_date,
                  "endDate": end_date,
                  "counts": counts
              })

          latest_file = valid_files[0].name if valid_files else None

          index = {
              "updated_at": now.isoformat(),
              "schedule": "every 3 hours",
              "fetch_days": fetch_days,
              "max_files": max_files,
              "retention_note": "3-hourly cache, latest 56 files are retained, approximately 7 days",
              "latest": latest_file,
              "last_attempt": f"{stamp}.json",
              "latest_policy": "latest valid cache file with any successful DONKI source",
              "files": file_entries
          }

          index_file = base_dir / "index.json"
          index_file.write_text(
              json.dumps(index, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("")
          print("Saved:", index_file)
          print(json.dumps(index, ensure_ascii=False, indent=2))

          # DONKIが全部失敗してもworkflowは成功扱いにする
          # 理由：過去の成功キャッシュをlatestとして残すため
          if not payload["any_ok"]:
              print("")
              print("WARNING: All DONKI sources failed in this attempt.")
              print("This workflow still succeeds so previous valid cache can remain latest.")

          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/donki

          git commit -m "Update DONKI cache" || echo "No changes"
          git push