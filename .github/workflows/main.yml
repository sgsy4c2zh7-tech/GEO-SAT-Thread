name: Update Helioviewer AIA193 LASCO C2 Images

on:
  workflow_dispatch:
  schedule:
    # 1時間ごとに更新。初回は過去2日分、以後は不足分だけ追加
    - cron: "8 * * * *"

permissions:
  contents: write

jobs:
  update-helioviewer-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch AIA193 and LASCO C2 images from Helioviewer
        run: |
          python3 <<'PYCODE'
          import json
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          # =========================================================
          # Settings
          # =========================================================
          # 保存対象はこの2種類だけ
          CHANNELS = [
              {
                  "kind": "solar",
                  "channel": "AIA193",
                  "label": "SDO/AIA 193",
                  "sourceId": 11,
                  "layers": "[SDO,AIA,AIA,193,1,100]",
                  # 太陽円盤が大きく見える設定
                  "imageScale": 2.42,
                  "width": 768,
                  "height": 768,
                  "x0": 0,
                  "y0": 0,
                  "watermark": "true"
              },
              {
                  "kind": "c2",
                  "channel": "LASCO_C2",
                  "label": "SOHO/LASCO C2",
                  "sourceId": 4,
                  "layers": "[SOHO,LASCO,C2,white-light,1,100]",
                  # LASCO C2全体が入る設定
                  "imageScale": 11.0,
                  "width": 768,
                  "height": 768,
                  "x0": 0,
                  "y0": 0,
                  "watermark": "true"
              }
          ]

          API_BASE = "https://api.helioviewer.org/v2"
          OUT_DIR = Path("docs/data/helioviewer")
          IMG_DIR = OUT_DIR / "images"
          OUT_DIR.mkdir(parents=True, exist_ok=True)
          IMG_DIR.mkdir(parents=True, exist_ok=True)

          # 互換用。既存HTMLが ./data/cdaw/index.json を読んでも使えるよう同じJSONを置く。
          COMPAT_DIR = Path("docs/data/cdaw")
          COMPAT_DIR.mkdir(parents=True, exist_ok=True)

          now = datetime.now(timezone.utc).replace(second=0, microsecond=0)
          history_days = 2
          cadence_minutes = 15
          start = now - timedelta(days=history_days)
          cutoff = start

          def floor_to_cadence(dt):
              m = (dt.minute // cadence_minutes) * cadence_minutes
              return dt.replace(minute=m, second=0, microsecond=0)

          start_slot = floor_to_cadence(start)
          end_slot = floor_to_cadence(now)

          def iso_z(dt):
              return dt.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          def safe_stamp(dt):
              return dt.astimezone(timezone.utc).strftime("%Y%m%d_%H%M")

          def image_filename(ch, dt):
              return f"{ch['channel'].lower()}_{safe_stamp(dt)}.png"

          def fetch_bytes(url, tries=3, timeout=120):
              last = None
              for i in range(tries):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "github-actions-helioviewer-aia193-c2-cache/1.0",
                              "Accept": "image/png,image/*,*/*"
                          }
                      )
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          data = r.read()
                          headers = dict(r.headers.items())
                          status = getattr(r, "status", None)
                          return data, headers, status
                  except Exception as e:
                      last = e
                      print(f"  retry {i+1}/{tries} failed:", e)
                      time.sleep(5 * (i + 1))
              raise last

          def build_screenshot_url(dt, ch):
              params = {
                  "date": iso_z(dt),
                  "imageScale": str(ch["imageScale"]),
                  "layers": ch["layers"],
                  "events": "",
                  "eventLabels": "false",
                  "scale": "false",
                  "x0": str(ch["x0"]),
                  "y0": str(ch["y0"]),
                  "width": str(ch["width"]),
                  "height": str(ch["height"]),
                  "display": "true",
                  "watermark": ch["watermark"]
              }
              # layers の [] と , はエンコードしない
              return API_BASE + "/takeScreenshot/?" + urllib.parse.urlencode(params, safe="[],")

          # =========================================================
          # Build target slots: now-2d to now, every 15 minutes
          # =========================================================
          times = []
          t = start_slot
          while t <= end_slot:
              times.append(t)
              t += timedelta(minutes=cadence_minutes)

          print("Now:", iso_z(now))
          print("Start:", iso_z(start_slot))
          print("End:", iso_z(end_slot))
          print("Cadence minutes:", cadence_minutes)
          print("Time slots:", len(times))
          print("Channels:", ", ".join(ch["label"] for ch in CHANNELS))

          # =========================================================
          # Download only missing files
          # =========================================================
          images = []
          failures = []
          downloaded = 0
          reused = 0

          for dt in times:
              for ch in CHANNELS:
                  filename = image_filename(ch, dt)
                  out_file = IMG_DIR / filename
                  screenshot_url = build_screenshot_url(dt, ch)

                  ok = False
                  cached = False

                  if out_file.exists() and out_file.stat().st_size > 1000:
                      ok = True
                      cached = True
                      reused += 1
                  else:
                      try:
                          print("Download:", ch["label"], iso_z(dt))
                          data, headers, status = fetch_bytes(screenshot_url)
                          ctype = (headers.get("Content-Type") or headers.get("content-type") or "").lower()
                          if not data or len(data) < 1000:
                              raise RuntimeError(f"image too small: {len(data) if data else 0}")
                          if b"<html" in data[:300].lower():
                              raise RuntimeError("got HTML instead of image")
                          out_file.write_bytes(data)
                          ok = True
                          downloaded += 1
                      except Exception as e:
                          msg = f"{ch['label']} {iso_z(dt)}: {e}"
                          print("ERROR:", msg)
                          failures.append(msg)

                  if ok:
                      images.append({
                          "kind": ch["kind"],
                          "channel": ch["channel"],
                          "label": ch["label"],
                          "instrument": ch["label"],
                          "time": iso_z(dt),
                          "target_time": iso_z(dt),
                          "file": filename,
                          "path": f"./data/helioviewer/images/{filename}",
                          "source_url": screenshot_url,
                          "source": "Helioviewer takeScreenshot",
                          "sourceId": ch["sourceId"],
                          "cadence_minutes": cadence_minutes,
                          "cached": cached
                      })

          # =========================================================
          # Delete files older than past 2 days or non-target channels
          # =========================================================
          keep_names = {img["file"] for img in images}
          deleted = []
          for f in IMG_DIR.glob("*.png"):
              if f.name not in keep_names:
                  try:
                      f.unlink()
                      deleted.append(f.name)
                  except Exception as e:
                      failures.append(f"delete {f.name}: {e}")

          # 古いCDAW互換ディレクトリの画像は混乱防止で削除してよい
          compat_img_dir = COMPAT_DIR / "images"
          if compat_img_dir.exists():
              for f in compat_img_dir.glob("*"):
                  try:
                      if f.is_file():
                          f.unlink()
                  except Exception:
                      pass

          images.sort(key=lambda x: x["time"], reverse=True)

          by_channel = {}
          for img in images:
              by_channel[img["channel"]] = by_channel.get(img["channel"], 0) + 1

          index = {
              "updated_at": iso_z(now),
              "source": "Helioviewer API takeScreenshot",
              "note": "Only SDO/AIA 193 and SOHO/LASCO C2 are saved. Past 2 days only. 15-minute cadence.",
              "history_days": history_days,
              "cadence_minutes": cadence_minutes,
              "start": iso_z(start_slot),
              "end": iso_z(end_slot),
              "image_count": len(images),
              "downloaded": downloaded,
              "reused": reused,
              "deleted_count": len(deleted),
              "deleted": deleted[:80],
              "failure_count": len(failures),
              "failures": failures[:120],
              "channels": [
                  {"channel": ch["channel"], "label": ch["label"], "kind": ch["kind"], "sourceId": ch["sourceId"]}
                  for ch in CHANNELS
              ],
              "by_channel": by_channel,
              "images": images
          }

          (OUT_DIR / "index.json").write_text(
              json.dumps(index, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          # 互換用 index.json。画像pathは helioviewer 側を指したままにする。
          (COMPAT_DIR / "index.json").write_text(
              json.dumps(index, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print(json.dumps({
              "image_count": len(images),
              "by_channel": by_channel,
              "downloaded": downloaded,
              "reused": reused,
              "deleted_count": len(deleted),
              "failure_count": len(failures)
          }, ensure_ascii=False, indent=2))

          if len(images) == 0:
              raise SystemExit("No Helioviewer images saved")

          PYCODE

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/helioviewer docs/data/cdaw/index.json

          git commit -m "Update Helioviewer AIA193 and LASCO C2 images" || echo "No changes"
          git push
