name: Update WSA Solar Wind Cache

on:
  workflow_dispatch:
  schedule:
    # 1日1回 UTC 02:00 / 日本時間 11:00
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  update-wsa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch WSA Dashboard solar wind model
        run: |
          python3 <<'PY'
          import json
          import time
          import urllib.request
          import urllib.parse
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          # =========================
          # Settings
          # =========================
          base_dir = Path("docs/data/wsa")
          base_dir.mkdir(parents=True, exist_ok=True)

          now = datetime.now(timezone.utc)
          today = now.strftime("%Y-%m-%d")

          # 過去27日 + 将来4日
          history_days = 27
          forecast_days = 4
          retention_days = 35

          start_dt = now - timedelta(days=history_days)
          end_dt = now + timedelta(days=forecast_days)

          start = start_dt.strftime("%Y-%m-%d")
          end = end_dt.strftime("%Y-%m-%d")

          # CCMC WSA Dashboard API
          # input_map: AGONG / AHMI
          # sat: ACE / DSCOVR / Earth など
          input_map = "AGONG"
          sat = "ACE"

          base_url = "https://ccmc.gsfc.nasa.gov/wsa-dashboard/api/get_solarwind_simple"

          params = {
              "start_date": start,
              "end_date": end,
              "input_map": input_map,
              "sat": sat
          }

          url = base_url + "?" + urllib.parse.urlencode(params)

          print("WSA Dashboard API")
          print("now:", now.isoformat())
          print("start_date:", start)
          print("end_date:", end)
          print("history_days:", history_days)
          print("forecast_days:", forecast_days)
          print("input_map:", input_map)
          print("sat:", sat)
          print("url:", url)

          # =========================
          # Fetch helper
          # =========================
          def fetch_json(url, tries=5, timeout=120):
              last_error = None

              for i in range(tries):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "github-actions-wsa-cache",
                              "Accept": "application/json,*/*"
                          }
                      )

                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          text = r.read().decode("utf-8", errors="replace")
                          print("HTTP status:", r.status)
                          print("Response head:", text[:500].replace("\n", " "))

                          return json.loads(text)

                  except Exception as e:
                      last_error = e
                      wait = 20 * (i + 1)
                      print(f"Retry {i+1}/{tries} failed:", e)
                      print(f"Waiting {wait} sec...")
                      time.sleep(wait)

              raise last_error

          # =========================
          # Parse helpers
          # =========================
          def parse_time(value):
              if value is None:
                  return None

              s = str(value).strip()

              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"

              try:
                  dt = datetime.fromisoformat(s)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  return None

          def to_float(value):
              try:
                  if value is None:
                      return None

                  s = str(value).strip()

                  if s == "" or s.lower() in ("nan", "none", "null"):
                      return None

                  return float(s)

              except Exception:
                  return None

          # =========================
          # Fetch WSA
          # =========================
          obj = fetch_json(url)

          if not isinstance(obj, dict):
              raise SystemExit("WSA response is not JSON object")

          solarwind = obj.get("solarwind")

          if not isinstance(solarwind, list):
              print("Response keys:", list(obj.keys()))
              print("Full response head:")
              print(json.dumps(obj, ensure_ascii=False, indent=2)[:1500])
              raise SystemExit("No solarwind list in WSA response")

          records = []

          for row in solarwind:
              if not isinstance(row, dict):
                  continue

              dt = parse_time(row.get("time"))

              # get_solarwind_simple の速度キー
              # Vp = solar wind proton speed
              speed = to_float(row.get("Vp"))

              if not dt or speed is None:
                  continue

              # 常識的な範囲のみ採用
              if speed < 150 or speed > 1200:
                  continue

              rec = {
                  "time": dt.isoformat(),
                  "speed": round(speed, 2),
                  "is_forecast": dt > now
              }

              # IMF polarity
              if "imf_polarity" in row:
                  pol = to_float(row.get("imf_polarity"))
                  if pol is not None:
                      rec["imf_polarity"] = int(pol)

              # 将来API側に密度や磁場が入った場合に拾う
              optional_map = {
                  "density": ["density", "Np", "n", "proton_density"],
                  "bt": ["Bt", "bt", "B"],
                  "bz": ["Bz", "bz"]
              }

              for out_key, keys in optional_map.items():
                  for k in keys:
                      if k in row:
                          v = to_float(row.get(k))
                          if v is not None:
                              rec[out_key] = round(v, 3)
                              break

              records.append(rec)

          # 時刻順に整列
          records.sort(key=lambda x: x["time"])

          # 重複削除
          dedup = {}
          for r in records:
              dedup[r["time"]] = r

          records = list(dedup.values())

          if not records:
              raise SystemExit("No valid WSA solar wind records parsed")

          forecast_count = sum(1 for r in records if r.get("is_forecast"))
          history_count = len(records) - forecast_count

          print("Parsed WSA records:", len(records))
          print("History records:", history_count)
          print("Forecast records:", forecast_count)
          print("First:", records[0])
          print("Last:", records[-1])

          # =========================
          # Save payload
          # =========================
          payload = {
              "generated_at": now.isoformat(),
              "source": "NASA CCMC WSA Dashboard",
              "api": "get_solarwind_simple",
              "url": url,
              "input_map": input_map,
              "sat": sat,
              "startDate": start,
              "endDate": end,
              "history_days": history_days,
              "forecast_days": forecast_days,
              "record_count": len(records),
              "history_record_count": history_count,
              "forecast_record_count": forecast_count,
              "now_utc": now.isoformat(),
              "records": records,
              "raw_meta": {
                  "comment": obj.get("comment"),
                  "input_map": obj.get("input_map"),
                  "sat": obj.get("sat")
              }
          }

          daily_file = base_dir / f"{today}.json"
          latest_file = base_dir / "latest.json"
          history_file = base_dir / "history-27d-plus-4d.json"

          daily_file.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          latest_file.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          history_file.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Saved:", daily_file)
          print("Saved:", latest_file)
          print("Saved:", history_file)

          # =========================
          # Retention
          # =========================
          keep_dates = {
              (now - timedelta(days=i)).strftime("%Y-%m-%d")
              for i in range(retention_days)
          }

          for f in base_dir.glob("*.json"):
              if f.name in (
                  "index.json",
                  "latest.json",
                  "history-27d.json",
                  "history-27d-plus-4d.json"
              ):
                  continue

              if f.stem not in keep_dates:
                  print("Delete old file:", f)
                  f.unlink()

          # =========================
          # Build index.json
          # =========================
          all_files = sorted(
              [
                  f for f in base_dir.glob("*.json")
                  if f.name not in (
                      "index.json",
                      "latest.json",
                      "history-27d.json",
                      "history-27d-plus-4d.json"
                  )
              ],
              reverse=True
          )

          file_entries = []

          for f in all_files:
              try:
                  item = json.loads(f.read_text(encoding="utf-8"))

                  file_entries.append({
                      "date": f.stem,
                      "file": f.name,
                      "path": f"./data/wsa/{f.name}",
                      "generated_at": item.get("generated_at"),
                      "startDate": item.get("startDate"),
                      "endDate": item.get("endDate"),
                      "history_days": item.get("history_days"),
                      "forecast_days": item.get("forecast_days"),
                      "input_map": item.get("input_map"),
                      "sat": item.get("sat"),
                      "record_count": item.get("record_count", 0),
                      "history_record_count": item.get("history_record_count", 0),
                      "forecast_record_count": item.get("forecast_record_count", 0)
                  })

              except Exception as e:
                  file_entries.append({
                      "date": f.stem,
                      "file": f.name,
                      "path": f"./data/wsa/{f.name}",
                      "error": str(e)
                  })

          index = {
              "updated_at": now.isoformat(),
              "source": "NASA CCMC WSA Dashboard",
              "api": "get_solarwind_simple",
              "input_map": input_map,
              "sat": sat,
              "history_days": history_days,
              "forecast_days": forecast_days,
              "retention_days": retention_days,
              "latest": "latest.json",
              "history": "history-27d-plus-4d.json",
              "latest_daily": f"{today}.json",
              "files": file_entries
          }

          index_file = base_dir / "index.json"
          index_file.write_text(
              json.dumps(index, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Saved:", index_file)
          print(json.dumps(index, ensure_ascii=False, indent=2))

          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/wsa

          git commit -m "Update WSA solar wind cache with forecast" || echo "No changes"
          git push
