name: Update CDAW SOHO CME Images

on:
  workflow_dispatch:
  schedule:
    # 1日4回 UTC / 日本時間 00, 06, 12, 18時ごろ
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-cdaw-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch CDAW / SOHO images
        run: |
          python3 <<'PY'
          import json
          import re
          import time
          import hashlib
          import urllib.request
          import urllib.parse
          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          from email.utils import parsedate_to_datetime

          # =========================================================
          # Settings
          # =========================================================
          now = datetime.now(timezone.utc)
          days = 2
          since = now - timedelta(days=days)

          base_dir = Path("docs/data/cdaw")
          img_dir = base_dir / "images"
          img_dir.mkdir(parents=True, exist_ok=True)

          # User requested CDAW movie/mak. ただし画像URLが直接出ない場合があるので、
          # SOHO realtime directoriesも併用して2日分を保存する。
          page_targets = [
              ("CDAW movie/mak", "https://cdaw.gsfc.nasa.gov/movie/mak"),
              ("CDAW CME list", "https://cdaw.gsfc.nasa.gov/CME_list/"),
              ("SOHO realtime images", "https://soho.nascom.nasa.gov/data/realtime-images.html"),
              ("SOHO LASCO C2 dir", "https://soho.nascom.nasa.gov/data/realtime/c2/512/"),
              ("SOHO LASCO C3 dir", "https://soho.nascom.nasa.gov/data/realtime/c3/512/"),
              ("SOHO EIT 195 dir", "https://soho.nascom.nasa.gov/data/realtime/eit_195/512/"),
              ("SOHO EIT 304 dir", "https://soho.nascom.nasa.gov/data/realtime/eit_304/512/"),
          ]

          # fallback latest images
          fixed_images = [
              ("SOHO LASCO C2 latest", "https://soho.nascom.nasa.gov/data/realtime/c2/512/latest.jpg"),
              ("SOHO LASCO C3 latest", "https://soho.nascom.nasa.gov/data/realtime/c3/512/latest.jpg"),
              ("SOHO EIT 195 latest", "https://soho.nascom.nasa.gov/data/realtime/eit_195/512/latest.jpg"),
              ("SOHO EIT 304 latest", "https://soho.nascom.nasa.gov/data/realtime/eit_304/512/latest.jpg"),
          ]

          image_exts = (".jpg", ".jpeg", ".png", ".gif")
          max_candidates = 350
          max_downloads = 180
          errors = []

          # =========================================================
          # Helpers
          # =========================================================
          def fetch_bytes(url, timeout=45):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "github-actions-cdaw-soho-image-cache/1.0",
                      "Accept": "text/html,image/*,*/*"
                  }
              )
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  data = r.read()
                  headers = dict(r.headers.items())
                  return data, headers, getattr(r, "status", None)

          def fetch_text(url):
              data, headers, status = fetch_bytes(url)
              return data.decode("utf-8", errors="replace"), headers, status

          def resolve_url(base, href):
              if not href:
                  return None
              href = href.strip().strip('"').strip("'")
              if href.startswith("data:") or href.startswith("javascript:"):
                  return None
              return urllib.parse.urljoin(base, href)

          def is_image_url(url):
              path = urllib.parse.urlparse(url).path.lower()
              return path.endswith(image_exts)

          def classify_kind(url, label=""):
              s = (url + " " + label).lower()
              if "lasco" in s and "c2" in s or "/c2/" in s or "_c2" in s or "c2_" in s:
                  return "LASCO C2"
              if "lasco" in s and "c3" in s or "/c3/" in s or "_c3" in s or "c3_" in s:
                  return "LASCO C3"
              if "eit_195" in s or "195" in s:
                  return "SOHO EIT 195"
              if "eit_304" in s or "304" in s:
                  return "SOHO EIT 304"
              if "aia" in s and "193" in s:
                  return "SDO AIA 193"
              if "aia" in s and "304" in s:
                  return "SDO AIA 304"
              if "eit" in s:
                  return "SOHO EIT"
              if "soho" in s:
                  return "SOHO"
              if "cdaw" in s:
                  return "CDAW"
              return "Solar image"

          def parse_time_from_url(url):
              name = Path(urllib.parse.urlparse(url).path).name

              patterns = [
                  r"(20\d{2})(\d{2})(\d{2})[_-]?(\d{2})(\d{2})(\d{2})?",
                  r"(20\d{2})[-_](\d{2})[-_](\d{2})[T_\- ]?(\d{2})[:_]?(\d{2})(?::?(\d{2}))?",
              ]

              for pat in patterns:
                  m = re.search(pat, name)
                  if not m:
                      continue
                  y, mo, d, hh, mm, ss = m.groups()
                  try:
                      return datetime(
                          int(y), int(mo), int(d), int(hh), int(mm), int(ss or 0),
                          tzinfo=timezone.utc
                      )
                  except Exception:
                      pass

              return None

          def parse_last_modified(headers):
              lm = headers.get("Last-Modified") or headers.get("last-modified")
              if not lm:
                  return None
              try:
                  dt = parsedate_to_datetime(lm)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  return None

          def safe_slug(s, limit=80):
              s = re.sub(r"[^A-Za-z0-9_.-]+", "_", s)
              s = s.strip("_")
              return s[:limit] or "image"

          def local_filename(url, kind, dt):
              ext = Path(urllib.parse.urlparse(url).path).suffix.lower()
              if ext not in image_exts:
                  ext = ".jpg"
              stamp = dt.strftime("%Y%m%dT%H%M%SZ") if dt else now.strftime("%Y%m%dT%H%M%SZ")
              name = Path(urllib.parse.urlparse(url).path).name
              stem = safe_slug(Path(name).stem)
              k = safe_slug(kind.lower().replace(" ", "_"))
              h = hashlib.sha1(url.encode("utf-8")).hexdigest()[:8]
              return f"{stamp}_{k}_{stem}_{h}{ext}"

          def extract_image_urls(page_url, html):
              out = []

              # img/src, a/href, source/src などから拾う
              for attr in ("src", "href"):
                  for m in re.finditer(attr + r'\s*=\s*["\']([^"\']+)["\']', html, flags=re.I):
                      u = resolve_url(page_url, m.group(1))
                      if u and is_image_url(u):
                          out.append(u)

              # 生URLも拾う
              for m in re.finditer(r'https?://[^\s"\'<>]+?\.(?:jpg|jpeg|png|gif)', html, flags=re.I):
                  u = m.group(0)
                  if is_image_url(u):
                      out.append(u)

              # Apache indexで href が相対の場合
              for m in re.finditer(r'>([^<]+\.(?:jpg|jpeg|png|gif))<', html, flags=re.I):
                  u = resolve_url(page_url, m.group(1))
                  if u and is_image_url(u):
                      out.append(u)

              return out

          # =========================================================
          # Discover candidates
          # =========================================================
          candidates = []

          for label, page in page_targets:
              try:
                  print("Fetch page:", label, page)
                  html, headers, status = fetch_text(page)
                  print("  status:", status, "bytes:", len(html))
                  urls = extract_image_urls(page, html)
                  print("  image urls:", len(urls))
                  for u in urls:
                      candidates.append({
                          "source_name": label,
                          "source_page": page,
                          "url": u,
                          "time": parse_time_from_url(u)
                      })
              except Exception as e:
                  msg = f"{label}: {e}"
                  print("  ERROR:", msg)
                  errors.append(msg)

          # fixed latest fallback
          for label, u in fixed_images:
              candidates.append({
                  "source_name": label,
                  "source_page": u,
                  "url": u,
                  "time": None,
                  "fixed_latest": True
              })

          # dedupe by URL
          dedup = {}
          for c in candidates:
              dedup[c["url"]] = c
          candidates = list(dedup.values())

          # Prefer dated recent files; keep latest fallback too
          filtered = []
          for c in candidates:
              dt = c.get("time")
              if dt is not None:
                  if dt >= since - timedelta(hours=6) and dt <= now + timedelta(hours=2):
                      filtered.append(c)
              elif c.get("fixed_latest"):
                  filtered.append(c)
              else:
                  # 日付不明は候補が少ない場合のみ使う
                  filtered.append(c)

          # Sort: dated recent first, then latest fallback
          filtered.sort(
              key=lambda x: (
                  0 if x.get("time") is not None else 1,
                  -(x.get("time") or now).timestamp()
              )
          )

          filtered = filtered[:max_candidates]

          print("Candidates total:", len(candidates))
          print("Candidates filtered:", len(filtered))

          # =========================================================
          # Download images
          # =========================================================
          images = []
          seen_files = set()

          for c in filtered:
              if len(images) >= max_downloads:
                  break

              url = c["url"]
              kind = classify_kind(url, c.get("source_name", ""))

              try:
                  data, headers, status = fetch_bytes(url, timeout=60)
                  if status and int(status) >= 400:
                      raise RuntimeError(f"HTTP {status}")

                  if len(data) < 2000:
                      raise RuntimeError(f"too small: {len(data)} bytes")

                  dt = c.get("time") or parse_last_modified(headers) or now

                  # latest fallbackで古いLast-Modifiedの場合も、UI用に取得時刻を使う
                  if c.get("fixed_latest") and dt < since:
                      dt = now

                  # 日付が明らかに範囲外ならスキップ。ただしfixed latestは保存。
                  if not c.get("fixed_latest"):
                      if dt < since - timedelta(hours=6) or dt > now + timedelta(hours=2):
                          continue

                  fname = local_filename(url, kind, dt)
                  if fname in seen_files:
                      continue

                  fpath = img_dir / fname
                  fpath.write_bytes(data)
                  seen_files.add(fname)

                  images.append({
                      "kind": kind,
                      "label": kind,
                      "time": dt.isoformat(),
                      "downloaded_at": now.isoformat(),
                      "file": f"images/{fname}",
                      "path": f"./data/cdaw/images/{fname}",
                      "source_name": c.get("source_name"),
                      "source_page": c.get("source_page"),
                      "source_url": url,
                      "bytes": len(data),
                      "is_latest_fallback": bool(c.get("fixed_latest"))
                  })

                  print("Saved:", fname, kind, dt.isoformat(), len(data), "bytes")

              except Exception as e:
                  msg = f"{url}: {e}"
                  print("  IMAGE ERROR:", msg)
                  errors.append(msg)

              time.sleep(0.1)

          images.sort(key=lambda x: x["time"], reverse=True)

          # =========================================================
          # Cleanup old images
          # =========================================================
          keep_files = {Path(x["file"]).name for x in images}
          for f in img_dir.glob("*"):
              if f.is_file() and f.name not in keep_files:
                  print("Delete old image:", f)
                  f.unlink()

          # =========================================================
          # Save index
          # =========================================================
          by_kind = {}
          for img in images:
              by_kind[img["kind"]] = by_kind.get(img["kind"], 0) + 1

          index = {
              "updated_at": now.isoformat(),
              "source": "CDAW movie/mak + SOHO realtime fallback",
              "requested_url": "https://cdaw.gsfc.nasa.gov/movie/mak",
              "days": days,
              "since": since.isoformat(),
              "image_count": len(images),
              "by_kind": by_kind,
              "images": images,
              "errors": errors[-40:]
          }

          base_dir.mkdir(parents=True, exist_ok=True)
          (base_dir / "index.json").write_text(
              json.dumps(index, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Saved:", base_dir / "index.json")
          print(json.dumps({
              "updated_at": index["updated_at"],
              "image_count": index["image_count"],
              "by_kind": index["by_kind"],
              "errors": len(errors)
          }, ensure_ascii=False, indent=2))

          # 画像0枚でもActionsは失敗させない。UIにエラー表示させる。
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/cdaw

          git commit -m "Update CDAW SOHO CME images" || echo "No changes"
          git push
