name: Update SWIFT AI Pipeline v1.5.1 CHARGE Timeline

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: swift-space-weather-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31.0" "numpy>=1.26" "scipy>=1.11" "Pillow>=10.0" "xlsxwriter>=3.2.0" "astropy>=6.0,<8"
          python - <<'PY'
          import astropy
          from astropy.io import fits
          print("astropy:", astropy.__version__)
          print("astropy.io.fits: OK")
          PY

      - name: Update NOAA observations
        run: python scripts/update_noaa_space_weather_history.py

      - name: Detect coronal holes
        run: python scripts/build_coronal_holes.py

      - name: Fetch NOAA WSA-ENLIL
        run: python scripts/fetch_noaa_wsa_enlil.py

      - name: Learn CME wind boost
        run: python scripts/learn_cme_wind_boost.py

      - name: Build SWIFT Wind AI with CH residual
        run: python scripts/build_swift_wind_ai.py

      - name: Blend official WSA-ENLIL by verified skill
        run: python scripts/blend_swift_wind_enlil.py

      - name: Build SWIFT Bz AI
        run: python scripts/build_swift_bz_ai.py

      - name: Build SWIFT Kp AI v0.9
        run: python scripts/build_swift_kp_ai.py

      - name: Build SWIFT-CHARGE 72h charging forecast
        run: python scripts/build_swift_charging_ai.py

      - name: Score issued forecasts and update uncertainty/calibration
        run: python scripts/build_research_validation.py

      - name: Build monthly research Excel and UI feed
        run: python scripts/build_swift_monthly_excel_report.py

      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required=[
            "docs/data/coronal-holes/latest.json",
            "docs/data/swift-wind/latest.json",
            "docs/data/swift-wind/forecast-archive.json",
            "docs/data/swift-bz/latest.json",
            "docs/data/swift-kp/latest.json",
            "docs/data/swift-charging/latest.json",
            "docs/data/swift-charging/observed.json",
            "docs/data/swift-charging/verification.json",
            "docs/data/validation/latest.json",
            "docs/reports/index.json",
            "docs/reports/ui_forecast_latest.json",
          ]
          for s in required:
              p=Path(s); assert p.exists() and p.stat().st_size>0, f"missing {p}"
          kp=json.loads(Path("docs/data/swift-kp/latest.json").read_text())
          ch=json.loads(Path("docs/data/coronal-holes/latest.json").read_text())
          charge=json.loads(Path("docs/data/swift-charging/latest.json").read_text())
          assert all(float(x.get("kp",0))>=0.33 for x in kp.get("forecast",[]))
          assert len(charge.get("forecast",[])) >= 25, "charging forecast must cover 0..72h at 3h step"
          print("Kp:",kp.get("model"),"rows",len(kp.get("forecast",[])))
          print("CH:",ch.get("model"),"regions",len(ch.get("coronal_holes",[])),"impacts",len(ch.get("earth_impacts",[])))
          print("CHARGE:",charge.get("model"),"rows",len(charge.get("forecast",[])))
          PY

      - name: Commit and push safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/reports || true
          if git diff --cached --quiet; then echo "No generated changes."; exit 0; fi
          git commit -m "Update SWIFT v1.5.1 timeline-synced charging forecast and monthly research report"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
