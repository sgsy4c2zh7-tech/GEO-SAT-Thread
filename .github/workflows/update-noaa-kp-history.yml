name: Update NOAA Kp History

on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Initial/target Kp history length in days. Use 35 for first run."
        required: false
        default: "35"
  schedule:
    # 3時間ごと。初回以降は新しいKp実測だけ追記
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  update-noaa-kp-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch NOAA observed Kp history
        run: |
          python3 <<'PY'
          import json
          import math
          import os
          import time
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          OUT_DIR = Path("docs/data/noaa-kp")
          OUT_DIR.mkdir(parents=True, exist_ok=True)

          HISTORY_PATH = OUT_DIR / "history.json"
          LATEST_PATH = OUT_DIR / "latest.json"
          INDEX_PATH = OUT_DIR / "index.json"

          now = datetime.now(timezone.utc)

          def safe_int(v, default, lo, hi):
              try:
                  n = int(str(v or "").strip())
                  return max(lo, min(hi, n))
              except Exception:
                  return default

          target_days = safe_int(os.environ.get("INPUT_BACKFILL_DAYS"), 35, 7, 180)
          keep_days = max(120, target_days + 30)

          # NOAA/SWPCのKp実測候補URL。存在しないものはskip。
          NOAA_KP_URLS = [
              "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json",
              "https://services.swpc.noaa.gov/json/planetary_k_index_1m.json"
          ]

          def parse_dt(value):
              if not value:
                  return None
              s = str(value).strip()
              if not s:
                  return None
              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"
              try:
                  dt = datetime.fromisoformat(s)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  return None

          def to_float(value, default=None):
              try:
                  if value is None:
                      return default
                  s = str(value).strip()
                  if not s or s.lower() in ("nan", "none", "null"):
                      return default
                  v = float(s)
                  if not math.isfinite(v):
                      return default
                  return v
              except Exception:
                  return default

          def floor_to_3h(dt):
              h = (dt.hour // 3) * 3
              return dt.replace(hour=h, minute=0, second=0, microsecond=0)

          def kp_to_third(kp):
              if kp is None:
                  return None
              return round(max(0.0, min(9.0, round(float(kp) * 3) / 3)), 2)

          def g_scale(kp):
              if kp is None:
                  return "NA"
              k = float(kp)
              if k >= 9:
                  return "G5"
              if k >= 8:
                  return "G4"
              if k >= 7:
                  return "G3"
              if k >= 6:
                  return "G2"
              if k >= 5:
                  return "G1"
              return "G0"

          def fetch_json(url, timeout=90):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "github-actions-noaa-kp-history",
                      "Accept": "application/json,*/*"
                  }
              )
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode("utf-8", errors="replace"))

          def load_json(path):
              if not path.exists():
                  return None
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception as e:
                  print("JSON read failed:", path, e)
                  return None

          def save_json(path, obj):
              path.write_text(json.dumps(obj, ensure_ascii=False, indent=2), encoding="utf-8")
              print("saved", path)

          def normalize_kp(data, source_url):
              rows = []
              if not isinstance(data, list) or not data:
                  return rows

              # products/noaa-planetary-k-index.json は list[list] 形式
              if isinstance(data[0], list):
                  header = [str(x).lower() for x in data[0]]
                  for row in data[1:]:
                      if not isinstance(row, list) or len(row) < 2:
                          continue

                      dt = parse_dt(row[0])
                      kp = None

                      for i, h in enumerate(header):
                          if i >= len(row):
                              continue
                          if "kp" in h or "k index" in h or "k-index" in h:
                              kp = to_float(row[i], kp)

                      # fallback
                      if kp is None and len(row) >= 2:
                          kp = to_float(row[1], None)
                      if kp is None and len(row) >= 3:
                          kp = to_float(row[2], kp)

                      if not dt or kp is None or kp < 0 or kp > 9:
                          continue

                      b = floor_to_3h(dt)
                      rows.append({
                          "time": b.isoformat(),
                          "_t": b.timestamp(),
                          "kp": kp_to_third(kp),
                          "kp_raw": kp,
                          "g_scale": g_scale(kp),
                          "source": "NOAA_PLANETARY_K",
                          "source_url": source_url
                      })

                  return rows

              # json/planetary_k_index_1m.json は dict形式の場合あり
              if isinstance(data[0], dict):
                  for r in data:
                      dt = parse_dt(r.get("time_tag") or r.get("time") or r.get("observation_time"))
                      kp = to_float(
                          r.get("kp")
                          or r.get("estimated_kp")
                          or r.get("planetary_k_index")
                          or r.get("k_index")
                      )

                      if not dt or kp is None or kp < 0 or kp > 9:
                          continue

                      b = floor_to_3h(dt)
                      rows.append({
                          "time": b.isoformat(),
                          "_t": b.timestamp(),
                          "kp": kp_to_third(kp),
                          "kp_raw": kp,
                          "g_scale": g_scale(kp),
                          "source": "NOAA_KP_JSON",
                          "source_url": source_url
                      })

              return rows

          old = load_json(HISTORY_PATH) or {"items": []}
          by_time = {}

          for r in old.get("items", []) or []:
              t = r.get("time")
              if t:
                  by_time[t] = r

          fetched_sources = []
          errors = []
          new_count = 0

          for url in NOAA_KP_URLS:
              try:
                  print("GET", url)
                  data = fetch_json(url)
                  rows = normalize_kp(data, url)
                  print("rows", len(rows), "from", url)

                  if not rows:
                      continue

                  rows.sort(key=lambda x: x["_t"])
                  fetched_sources.append({
                      "url": url,
                      "rows": len(rows),
                      "start": rows[0]["time"],
                      "end": rows[-1]["time"]
                  })

                  for r in rows:
                      if r["time"] not in by_time:
                          new_count += 1
                      by_time[r["time"]] = r

              except Exception as e:
                  print("skip", url, e)
                  errors.append({"url": url, "error": str(e)})

              time.sleep(1)

          keep_after = now - timedelta(days=keep_days)
          target_after = now - timedelta(days=target_days)

          items = []
          for t, r in by_time.items():
              dt = parse_dt(t)
              if dt and dt >= keep_after:
                  items.append(r)

          items.sort(key=lambda x: x["time"])

          recent_items = [r for r in items if parse_dt(r.get("time")) and parse_dt(r["time"]) >= target_after]

          history = {
              "updated_at": now.isoformat(),
              "target_days": target_days,
              "keep_days": keep_days,
              "item_count": len(items),
              "recent_target_count": len(recent_items),
              "new_items_this_run": new_count,
              "coverage": {
                  "start": items[0]["time"] if items else None,
                  "end": items[-1]["time"] if items else None,
                  "days": round((parse_dt(items[-1]["time"]) - parse_dt(items[0]["time"])).total_seconds() / 86400, 3) if len(items) >= 2 else 0
              },
              "fetched_sources": fetched_sources,
              "errors": errors[-20:],
              "items": items
          }

          latest = {
              "updated_at": now.isoformat(),
              "source": "NOAA SWPC observed planetary K index products",
              "description": "Accumulated NOAA observed Kp history for SWIFT Kp AI verification and lead-time skill.",
              "item_count": len(recent_items),
              "coverage": history["coverage"],
              "items": recent_items
          }

          index = {
              "updated_at": now.isoformat(),
              "history": "history.json",
              "latest": "latest.json",
              "coverage": history["coverage"],
              "files": []
          }

          save_json(HISTORY_PATH, history)
          save_json(LATEST_PATH, latest)

          for f in sorted(OUT_DIR.glob("*.json")):
              index["files"].append({
                  "file": f.name,
                  "path": f"./data/noaa-kp/{f.name}",
                  "size_bytes": f.stat().st_size
              })

          save_json(INDEX_PATH, index)

          print(json.dumps({
              "coverage": history["coverage"],
              "item_count": len(items),
              "recent_target_count": len(recent_items),
              "new_items_this_run": new_count,
              "fetched_sources": fetched_sources
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/noaa-kp

          git commit -m "Update NOAA Kp history" || echo "No changes"
          git push
