name: Update Helioviewer CME Window Images

on:
  workflow_dispatch:
  schedule:
    # DONKI更新の少し後を想定。CME発生時刻ごとに t0±1h の画像だけ補完
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  update-helioviewer-cme-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch AIA193 and LASCO C2 images around DONKI CME times
        run: |
          python3 <<'PY'
          import json
          import re
          import time
          import urllib.request
          import urllib.parse
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          DONKI_DIR = Path("docs/data/donki")
          OUT_DIR = Path("docs/data/helioviewer")
          IMG_DIR = OUT_DIR / "images"
          OUT_DIR.mkdir(parents=True, exist_ok=True)
          IMG_DIR.mkdir(parents=True, exist_ok=True)

          now = datetime.now(timezone.utc)

          # CME事象表示は過去3日から。画像はDONKI CME時刻 t0±1h だけ作る。
          past_days = 3
          window_minutes = 60
          step_minutes = 15
          max_events = 40

          since = now - timedelta(days=past_days)

          CHANNELS = [
              {
                  "key": "aia193",
                  "label": "SDO/AIA 193",
                  "kind": "AIA193",
                  "layer": "[SDO,AIA,AIA,193,1,100]",
                  "imageScale": 2.4204409,
                  "width": 1024,
                  "height": 1024,
                  "x0": 0,
                  "y0": 0
              },
              {
                  "key": "lasco_c2",
                  "label": "SOHO/LASCO C2",
                  "kind": "LASCO_C2",
                  "layer": "[SOHO,LASCO,C2,white-light,1,100]",
                  "imageScale": 11.42,
                  "width": 1024,
                  "height": 1024,
                  "x0": 0,
                  "y0": 0
              }
          ]

          def parse_dt(value):
              if not value:
                  return None
              s = str(value).strip()
              if not s:
                  return None
              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"
              try:
                  dt = datetime.fromisoformat(s)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              except Exception:
                  return None

          def safe_id(value):
              s = str(value or "CME")
              s = re.sub(r"[^A-Za-z0-9_.-]+", "_", s)
              return s[-80:]

          def iso_min(dt):
              return dt.strftime("%Y-%m-%dT%H:%M:%SZ")

          def stamp(dt):
              return dt.strftime("%Y%m%d_%H%M")

          def floor_to_step(dt, minutes):
              discard = timedelta(
                  minutes=dt.minute % minutes,
                  seconds=dt.second,
                  microseconds=dt.microsecond
              )
              return dt - discard

          def round_to_step(dt, minutes):
              base = floor_to_step(dt, minutes)
              if (dt - base) >= timedelta(minutes=minutes / 2):
                  base += timedelta(minutes=minutes)
              return base

          def read_json(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def load_donki_payloads():
              index_path = DONKI_DIR / "index.json"
              if not index_path.exists():
                  print("DONKI index not found:", index_path)
                  return [], {"error": "DONKI index.json not found"}

              index = read_json(index_path)
              files = []

              for f in index.get("files", []):
                  if f.get("valid") is False:
                      continue
                  name = f.get("file") or ""
                  if not name:
                      continue
                  files.append(DONKI_DIR / name)

              # fallback
              if not files and index.get("latest"):
                  files = [DONKI_DIR / index["latest"]]

              payloads = []
              for path in files[:80]:
                  if not path.exists():
                      continue
                  try:
                      payloads.append({
                          "file": path.name,
                          "payload": read_json(path)
                      })
                  except Exception as e:
                      print("skip DONKI file", path, e)

              return payloads, index

          def extract_cme_events(payloads):
              events = []
              seen = set()

              def add_event(event_id, t0, source, raw=None):
                  if not t0:
                      return
                  if t0 < since or t0 > now + timedelta(hours=2):
                      return

                  rounded = round_to_step(t0, step_minutes)
                  key = (safe_id(event_id), rounded.strftime("%Y%m%d_%H%M"))
                  if key in seen:
                      return
                  seen.add(key)

                  events.append({
                      "id": str(event_id or f"CME_{stamp(rounded)}"),
                      "safe_id": safe_id(event_id or f"CME_{stamp(rounded)}"),
                      "source": source,
                      "t0": t0,
                      "rounded_t0": rounded,
                      "raw_time": t0.isoformat(),
                      "window_start": rounded - timedelta(minutes=window_minutes),
                      "window_end": rounded + timedelta(minutes=window_minutes),
                  })

              for item in payloads:
                  p = item.get("payload") or {}
                  sources = p.get("sources") or {}

                  for a in sources.get("cmeAnalysis", {}).get("data", []) or []:
                      t0 = parse_dt(
                          a.get("time21_5")
                          or a.get("activityStartTime")
                          or a.get("noteTime")
                      )
                      add_event(
                          a.get("activityID") or a.get("associatedCMEID"),
                          t0,
                          "DONKI_CMEAnalysis",
                          a
                      )

                  for c in sources.get("cme", {}).get("data", []) or []:
                      t0 = parse_dt(c.get("startTime") or c.get("activityStartTime"))
                      add_event(c.get("activityID"), t0, "DONKI_CME", c)

                      for a in c.get("cmeAnalyses", []) or []:
                          at0 = parse_dt(
                              a.get("time21_5")
                              or a.get("activityStartTime")
                              or c.get("startTime")
                          )
                          add_event(
                              a.get("activityID") or c.get("activityID"),
                              at0,
                              "DONKI_CME.cmeAnalyses",
                              a
                          )

              events.sort(key=lambda x: x["t0"], reverse=True)
              return events[:max_events]

          def fetch_bytes(url, tries=3, timeout=120):
              last_error = None
              for i in range(tries):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "github-actions-helioviewer-cme-window-cache",
                              "Accept": "image/png,image/jpeg,application/json,*/*"
                          }
                      )
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return r.read(), r.headers.get("Content-Type", "")
                  except Exception as e:
                      last_error = str(e)
                      wait = 10 * (i + 1)
                      print(f"retry {i+1}/{tries} failed: {e}; wait {wait}s")
                      time.sleep(wait)
              raise RuntimeError(last_error)

          def screenshot_url(dt, ch):
              params = {
                  "date": iso_min(dt),
                  "layers": ch["layer"],
                  "imageScale": ch["imageScale"],
                  "width": ch["width"],
                  "height": ch["height"],
                  "x0": ch["x0"],
                  "y0": ch["y0"],
                  "display": "true",
                  "watermark": "false"
              }
              return "https://api.helioviewer.org/v2/takeScreenshot/?" + urllib.parse.urlencode(params)

          def save_image(event, dt, ch):
              filename = f"{ch['key']}_{stamp(dt)}.png"
              out_path = IMG_DIR / filename
              rel_path = f"./data/helioviewer/images/{filename}"

              if out_path.exists() and out_path.stat().st_size > 1000:
                  return {
                      "event_id": event["id"],
                      "event_t0": event["rounded_t0"].isoformat(),
                      "time": dt.isoformat(),
                      "kind": ch["kind"],
                      "label": ch["label"],
                      "file": filename,
                      "path": rel_path,
                      "cached": True,
                      "ok": True,
                      "size_bytes": out_path.stat().st_size
                  }

              url = screenshot_url(dt, ch)
              print("GET", event["id"], ch["label"], iso_min(dt))

              data, ctype = fetch_bytes(url)

              if b"{" in data[:20] and "json" in ctype.lower():
                  obj = json.loads(data.decode("utf-8", errors="replace"))
                  img_url = obj.get("url") or obj.get("uri") or obj.get("path")
                  if img_url:
                      if img_url.startswith("/"):
                          img_url = "https://api.helioviewer.org" + img_url
                      data, ctype = fetch_bytes(img_url)

              if len(data) < 1000:
                  raise RuntimeError(f"image too small: {len(data)} bytes")

              if not (data.startswith(b"\x89PNG") or data.startswith(b"\xff\xd8")):
                  raise RuntimeError(f"not PNG/JPEG content-type={ctype}")

              out_path.write_bytes(data)

              return {
                  "event_id": event["id"],
                  "event_t0": event["rounded_t0"].isoformat(),
                  "time": dt.isoformat(),
                  "kind": ch["kind"],
                  "label": ch["label"],
                  "file": filename,
                  "path": rel_path,
                  "cached": False,
                  "ok": True,
                  "size_bytes": len(data)
              }

          payloads, donki_index = load_donki_payloads()
          events = extract_cme_events(payloads)

          print("DONKI payloads:", len(payloads))
          print("CME events:", len(events))

          items = []
          errors = []
          referenced_files = set()

          for ev in events:
              t = ev["window_start"]
              ev_items = []

              while t <= ev["window_end"]:
                  for ch in CHANNELS:
                      try:
                          item = save_image(ev, t, ch)
                          items.append(item)
                          ev_items.append(item)
                          referenced_files.add(item["file"])
                      except Exception as e:
                          err = {
                              "event_id": ev["id"],
                              "time": t.isoformat(),
                              "kind": ch["kind"],
                              "label": ch["label"],
                              "error": str(e)
                          }
                          print("ERROR", err)
                          errors.append(err)

                      time.sleep(0.25)

                  t += timedelta(minutes=step_minutes)

              ev["image_count"] = len([x for x in ev_items if x.get("ok")])
              ev["aia193_count"] = len([x for x in ev_items if x.get("kind") == "AIA193"])
              ev["lasco_c2_count"] = len([x for x in ev_items if x.get("kind") == "LASCO_C2"])
              ev["images"] = ev_items

          # 今回のDONKI CME窓で使わない画像は削除する。
          for f in IMG_DIR.glob("*.png"):
              if f.name not in referenced_files:
                  print("delete unused image:", f)
                  f.unlink()

          # 実ファイルベースでindex再構築。items/imagesはHTML互換用。
          all_items = []

          for f in sorted(IMG_DIR.glob("*.png")):
              try:
                  if f.name.startswith("aia193_"):
                      kind = "AIA193"
                      label = "SDO/AIA 193"
                      prefix = "aia193_"
                  elif f.name.startswith("lasco_c2_"):
                      kind = "LASCO_C2"
                      label = "SOHO/LASCO C2"
                      prefix = "lasco_c2_"
                  else:
                      continue

                  dt = datetime.strptime(
                      f.stem.replace(prefix, ""),
                      "%Y%m%d_%H%M"
                  ).replace(tzinfo=timezone.utc)

                  all_items.append({
                      "time": dt.isoformat(),
                      "kind": kind,
                      "label": label,
                      "file": f.name,
                      "path": f"./data/helioviewer/images/{f.name}",
                      "size_bytes": f.stat().st_size
                  })

              except Exception as e:
                  print("index skip", f, e)

          all_items.sort(key=lambda x: (x["time"], x["kind"]))

          by_kind = {}
          for item in all_items:
              by_kind[item["kind"]] = by_kind.get(item["kind"], 0) + 1

          index = {
              "updated_at": now.isoformat(),
              "source": "Helioviewer API takeScreenshot",
              "description": "Images only around DONKI CME event times: t0 ± 1 hour, 15-minute cadence, SDO/AIA 193 and SOHO/LASCO C2 only.",
              "mode": "cme_windows",
              "past_days": past_days,
              "window_minutes": window_minutes,
              "step_minutes": step_minutes,
              "max_events": max_events,
              "since": since.isoformat(),
              "channels": [
                  {
                      "kind": ch["kind"],
                      "key": ch["key"],
                      "label": ch["label"],
                      "layer": ch["layer"]
                  }
                  for ch in CHANNELS
              ],
              "event_count": len(events),
              "image_count": len(all_items),
              "by_kind": by_kind,
              "events": [
                  {
                      "id": ev["id"],
                      "source": ev["source"],
                      "t0": ev["rounded_t0"].isoformat(),
                      "raw_time": ev["raw_time"],
                      "window_start": ev["window_start"].isoformat(),
                      "window_end": ev["window_end"].isoformat(),
                      "image_count": ev.get("image_count", 0),
                      "aia193_count": ev.get("aia193_count", 0),
                      "lasco_c2_count": ev.get("lasco_c2_count", 0),
                  }
                  for ev in events
              ],
              "items": all_items,
              "images": all_items,
              "errors_count": len(errors),
              "errors_sample": errors[:30]
          }

          (OUT_DIR / "index.json").write_text(
              json.dumps(index, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("saved", OUT_DIR / "index.json")
          print(json.dumps({
              "event_count": index["event_count"],
              "image_count": index["image_count"],
              "by_kind": index["by_kind"],
              "errors_count": index["errors_count"]
          }, ensure_ascii=False, indent=2))

          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/helioviewer

          git commit -m "Update Helioviewer CME window images" || echo "No changes"
          git push