name: Update SWIFT Wind Accuracy

on:
  workflow_dispatch:
  schedule:
    # NOAA Wind History更新後に3時間ごと。±50/75/100を評価
    - cron: "29 */3 * * *"

permissions:
  contents: write

jobs:
  update-swift-wind-accuracy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify SWIFT wind forecast accuracy
        run: |
          python3 <<'PY'
          import json, math, statistics
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          OUT = Path("docs/data/swift-wind")
          OUT.mkdir(parents=True, exist_ok=True)

          SWIFT_WIND = OUT / "latest.json"
          NOAA_WIND = Path("docs/data/noaa-wind/history.json")

          ACC = OUT / "accuracy.json"
          ACC_HIST = OUT / "accuracy-history.json"

          now = datetime.now(timezone.utc)

          def load_json(path, default=None):
              if not path.exists():
                  return default
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception as e:
                  print("load failed", path, e)
                  return default

          def save_json(path, obj):
              path.write_text(json.dumps(obj, ensure_ascii=False, indent=2), encoding="utf-8")
              print("saved", path)

          def parse_dt(v):
              if not v:
                  return None
              s = str(v).strip()
              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"
              try:
                  d = datetime.fromisoformat(s)
                  if d.tzinfo is None:
                      d = d.replace(tzinfo=timezone.utc)
                  return d.astimezone(timezone.utc)
              except Exception:
                  return None

          def fnum(v, default=None):
              try:
                  if v is None:
                      return default
                  x = float(v)
                  return x if math.isfinite(x) else default
              except Exception:
                  return default

          def get_speed(r):
              return fnum(
                  r.get("speed") or r.get("speed_kms") or r.get("proton_speed") or
                  r.get("v") or r.get("vsw") or r.get("bulk_speed")
              )

          sw = load_json(SWIFT_WIND, {})
          nh = load_json(NOAA_WIND, {"items":[]})

          forecasts = sw.get("forecast") or sw.get("items") or sw.get("data") or []
          forecast_rows = []
          for r in forecasts:
              dt = parse_dt(r.get("time") or r.get("target_time") or r.get("start_time"))
              sp = get_speed(r)
              if dt and sp is not None:
                  forecast_rows.append({"time": dt, "pred": sp, "raw": r})
          forecast_rows.sort(key=lambda x:x["time"])

          obs_rows = []
          for r in nh.get("items", []) or []:
              dt = parse_dt(r.get("time"))
              sp = get_speed(r)
              if dt and sp is not None:
                  obs_rows.append({"time": dt, "obs": sp})
          obs_rows.sort(key=lambda x:x["time"])

          def nearest_obs(t, max_minutes=75):
              best = None
              bd = 10**18
              for r in obs_rows:
                  d = abs((r["time"] - t).total_seconds())
                  if d < bd:
                      bd = d
                      best = r
              if best and bd <= max_minutes*60:
                  return best
              return None

          scored = []
          for f in forecast_rows:
              if f["time"] > now:
                  continue
              o = nearest_obs(f["time"])
              if not o:
                  continue
              err = f["pred"] - o["obs"]
              scored.append({
                  "time": f["time"].isoformat(),
                  "predicted_speed": round(f["pred"], 2),
                  "observed_speed": round(o["obs"], 2),
                  "error": round(err, 2),
                  "abs_error": round(abs(err), 2),
                  "hit_50kms": abs(err) <= 50,
                  "hit_75kms": abs(err) <= 75,
                  "hit_100kms": abs(err) <= 100,
                  "regime": "HSS" if o["obs"] >= 550 else "moderate" if o["obs"] >= 400 else "quiet"
              })

          def metrics(rows):
              if not rows:
                  return {
                      "count": 0,
                      "status": "learning",
                      "accuracy_score": None,
                      "mae": None,
                      "bias": None,
                      "rmse": None,
                      "hit_rate_50kms": None,
                      "hit_rate_75kms": None,
                      "hit_rate_100kms": None
                  }
              errs = [r["error"] for r in rows]
              abs_errs = [abs(e) for e in errs]
              mae = sum(abs_errs)/len(abs_errs)
              bias = sum(errs)/len(errs)
              rmse = math.sqrt(sum(e*e for e in errs)/len(errs))
              return {
                  "count": len(rows),
                  "status": "ok",
                  "target": "±50 km/s",
                  "accuracy_score": round(max(0, 100*(1-mae/150)), 1),
                  "mae": round(mae, 2),
                  "bias": round(bias, 2),
                  "rmse": round(rmse, 2),
                  "hit_rate_50kms": round(sum(1 for r in rows if r["hit_50kms"]) / len(rows) * 100, 1),
                  "hit_rate_75kms": round(sum(1 for r in rows if r["hit_75kms"]) / len(rows) * 100, 1),
                  "hit_rate_100kms": round(sum(1 for r in rows if r["hit_100kms"]) / len(rows) * 100, 1)
              }

          def since(days):
              cutoff = now - timedelta(days=days)
              return [r for r in scored if parse_dt(r["time"]) and parse_dt(r["time"]) >= cutoff]

          def regime_metrics(rows):
              out = {}
              for name in ("quiet","moderate","HSS"):
                  out[name] = metrics([r for r in rows if r["regime"] == name])
              return out

          last24 = since(1)
          last72 = since(3)
          last7 = since(7)
          last30 = since(30)

          summary = {
              "updated_at": now.isoformat(),
              "target": "±50 km/s",
              "note": "0-24h target ±50 km/s, 24-48h target ±75 km/s, 48-120h target ±100 km/s.",
              "last_24h": metrics(last24),
              "last_72h": metrics(last72),
              "last_7d": metrics(last7),
              "last_30d": metrics(last30),
              "by_regime_7d": regime_metrics(last7),
              "items": scored[-1000:]
          }

          hist = load_json(ACC_HIST, {"items":[]})
          hist_items = hist.get("items", [])
          hist_items.append({
              "time": now.isoformat(),
              "last_24h": summary["last_24h"],
              "last_72h": summary["last_72h"],
              "last_7d": summary["last_7d"]
          })
          hist_items = hist_items[-720:]

          save_json(ACC, {
              "updated_at": now.isoformat(),
              "latest": summary["last_24h"],
              "summary": summary
          })
          save_json(ACC_HIST, {
              "updated_at": now.isoformat(),
              "items": hist_items
          })

          print(json.dumps(summary["last_24h"], ensure_ascii=False, indent=2))
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/data/swift-wind/accuracy.json docs/data/swift-wind/accuracy-history.json
          git commit -m "Update SWIFT wind accuracy target50" || echo "No changes"
          git push
