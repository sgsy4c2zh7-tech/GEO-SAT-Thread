name: Update DONKI Cache

on:
  workflow_dispatch:
  schedule:
    # 3時間ごと
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  update-donki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch DONKI data
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          python3 <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.parse
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          OUT_DIR = Path("docs/data/donki")
          OUT_DIR.mkdir(parents=True, exist_ok=True)

          now = datetime.now(timezone.utc)
          stamp = now.strftime("%Y-%m-%dT%H00Z")

          # 2週間保存
          fetch_days = 14
          retention_days = 14
          max_files = 130

          start_dt = now - timedelta(days=fetch_days)
          end_dt = now

          start = start_dt.strftime("%Y-%m-%d")
          end = end_dt.strftime("%Y-%m-%d")

          api_key = os.environ.get("NASA_API_KEY", "").strip() or "DEMO_KEY"

          BASE = "https://api.nasa.gov/DONKI"

          endpoints = {
              "cmeAnalysis": "/CMEAnalysis",
              "cme": "/CME",
              "sep": "/SEP",
              "flr": "/FLR"
          }

          def fetch_json(name, path, tries=4):
              params = {
                  "startDate": start,
                  "endDate": end,
                  "api_key": api_key
              }

              url = BASE + path + "?" + urllib.parse.urlencode(params)
              safe_url = url.replace(api_key, "NASA_API_KEY")

              last_error = None

              for i in range(tries):
                  try:
                      print(f"[{name}] GET {safe_url}")

                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "github-actions-donki-cache",
                              "Accept": "application/json,*/*"
                          }
                      )

                      with urllib.request.urlopen(req, timeout=120) as r:
                          text = r.read().decode("utf-8", errors="replace")
                          print(f"[{name}] HTTP {r.status}, len={len(text)}")

                          data = json.loads(text)
                          count = len(data) if isinstance(data, list) else 1

                          return {
                              "ok": True,
                              "url": safe_url,
                              "count": count,
                              "data": data,
                              "error": None
                          }

                  except Exception as e:
                      last_error = str(e)
                      wait = 20 * (i + 1)
                      print(f"[{name}] retry {i+1}/{tries} failed: {e}")
                      print(f"[{name}] waiting {wait}s")
                      time.sleep(wait)

              return {
                  "ok": False,
                  "url": safe_url,
                  "count": 0,
                  "data": [],
                  "error": last_error
              }

          sources = {}

          for name, path in endpoints.items():
              sources[name] = fetch_json(name, path)

          any_ok = any(v["ok"] for v in sources.values())
          total_count = sum(v["count"] for v in sources.values() if v["ok"])

          payload = {
              "generated_at": now.isoformat(),
              "stamp": stamp,
              "source": "NASA DONKI",
              "startDate": start,
              "endDate": end,
              "fetch_days": fetch_days,
              "retention_days": retention_days,
              "max_files": max_files,
              "schedule": "every 3 hours",
              "any_ok": any_ok,
              "total_count": total_count,
              "sources": sources
          }

          out_file = OUT_DIR / f"{stamp}.json"
          out_file.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Saved:", out_file)

          latest_file = OUT_DIR / "latest.json"

          if any_ok:
              latest_file.write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2),
                  encoding="utf-8"
              )
              print("Saved:", latest_file)
          elif latest_file.exists():
              old = json.loads(latest_file.read_text(encoding="utf-8"))
              old["last_update_error"] = "DONKI fetch failed; preserved previous latest.json"
              old["last_failed_at"] = now.isoformat()

              latest_file.write_text(
                  json.dumps(old, ensure_ascii=False, indent=2),
                  encoding="utf-8"
              )

          cutoff = now - timedelta(days=retention_days)

          # 古いsnapshot削除
          for f in OUT_DIR.glob("*.json"):
              if f.name in ("index.json", "latest.json"):
                  continue

              delete = False

              try:
                  dt = datetime.strptime(f.stem, "%Y-%m-%dT%H00Z").replace(tzinfo=timezone.utc)
                  if dt < cutoff:
                      delete = True
              except Exception:
                  pass

              if delete:
                  print("Delete old:", f)
                  f.unlink()

          # 本数が多すぎる場合の削除
          snapshots = sorted(
              [
                  f for f in OUT_DIR.glob("*.json")
                  if f.name not in ("index.json", "latest.json")
              ],
              reverse=True
          )

          for f in snapshots[max_files:]:
              print("Delete overflow:", f)
              f.unlink()

          files = []

          for f in sorted(
              [
                  x for x in OUT_DIR.glob("*.json")
                  if x.name != "index.json"
              ],
              reverse=True
          ):
              try:
                  item = json.loads(f.read_text(encoding="utf-8"))

                  valid = bool(item.get("any_ok"))
                  count = int(item.get("total_count") or 0)

                  files.append({
                      "stamp": item.get("stamp") or f.stem,
                      "file": f.name,
                      "path": f"./data/donki/{f.name}",
                      "generated_at": item.get("generated_at"),
                      "startDate": item.get("startDate"),
                      "endDate": item.get("endDate"),
                      "valid": valid,
                      "total_count": count,
                      "counts": {
                          "cmeAnalysis": item.get("sources", {}).get("cmeAnalysis", {}).get("count", 0),
                          "cme": item.get("sources", {}).get("cme", {}).get("count", 0),
                          "sep": item.get("sources", {}).get("sep", {}).get("count", 0),
                          "flr": item.get("sources", {}).get("flr", {}).get("count", 0)
                      },
                      "error": item.get("last_update_error")
                  })

              except Exception as e:
                  files.append({
                      "stamp": f.stem,
                      "file": f.name,
                      "path": f"./data/donki/{f.name}",
                      "valid": False,
                      "error": str(e)
                  })

          index = {
              "updated_at": now.isoformat(),
              "source": "NASA DONKI",
              "latest": "latest.json" if latest_file.exists() else None,
              "last_attempt": out_file.name,
              "fetch_days": fetch_days,
              "retention_days": retention_days,
              "max_files": max_files,
              "files": files
          }

          index_file = OUT_DIR / "index.json"
          index_file.write_text(
              json.dumps(index, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Saved:", index_file)
          print(json.dumps(index, ensure_ascii=False, indent=2))

          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/donki

          git commit -m "Update DONKI cache" || echo "No changes"
          git push