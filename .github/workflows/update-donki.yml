name: Update DONKI Cache

on:
  workflow_dispatch:
  schedule:
    # 3時間ごと
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  update-donki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch DONKI data
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          python3 <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.parse
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          OUT_DIR = Path("docs/data/donki")
          OUT_DIR.mkdir(parents=True, exist_ok=True)

          now = datetime.now(timezone.utc)
          stamp = now.strftime("%Y-%m-%dT%H00Z")

          # 3時間更新・7日分保持
          fetch_days = 3
          max_files = 56

          start_dt = now - timedelta(days=fetch_days)
          end_dt = now

          start = start_dt.strftime("%Y-%m-%d")
          end = end_dt.strftime("%Y-%m-%d")

          api_key = os.environ.get("NASA_API_KEY", "").strip() or "DEMO_KEY"

          BASE = "https://api.nasa.gov/DONKI"

          endpoints = {
              "cmeAnalysis": "/CMEAnalysis",
              "cme": "/CME",
              "sep": "/SEP",
              "flr": "/FLR"
          }

          def fetch_json(name, path, tries=4):
              params = {
                  "startDate": start,
                  "endDate": end,
                  "api_key": api_key
              }

              url = BASE + path + "?" + urllib.parse.urlencode(params)

              last_error = None

              for i in range(tries):
                  try:
                      print(f"[{name}] GET {url}")
                      req = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "github-actions-donki-cache",
                              "Accept": "application/json,*/*"
                          }
                      )

                      with urllib.request.urlopen(req, timeout=90) as r:
                          text = r.read().decode("utf-8", errors="replace")
                          print(f"[{name}] HTTP {r.status}, len={len(text)}")

                          data = json.loads(text)

                          if isinstance(data, list):
                              count = len(data)
                          else:
                              count = 1

                          return {
                              "ok": True,
                              "url": url.replace(api_key, "NASA_API_KEY"),
                              "count": count,
                              "data": data,
                              "error": None
                          }

                  except Exception as e:
                      last_error = str(e)
                      wait = 20 * (i + 1)
                      print(f"[{name}] retry {i+1}/{tries} failed: {e}")
                      print(f"[{name}] waiting {wait}s")
                      time.sleep(wait)

              return {
                  "ok": False,
                  "url": url.replace(api_key, "NASA_API_KEY"),
                  "count": 0,
                  "data": [],
                  "error": last_error
              }

          sources = {}

          for name, path in endpoints.items():
              sources[name] = fetch_json(name, path)

          any_ok = any(v["ok"] for v in sources.values())
          total_count = sum(v["count"] for v in sources.values() if v["ok"])

          payload = {
              "generated_at": now.isoformat(),
              "stamp": stamp,
              "startDate": start,
              "endDate": end,
              "fetch_days": fetch_days,
              "max_files": max_files,
              "schedule": "every 3 hours",
              "any_ok": any_ok,
              "total_count": total_count,
              "sources": sources
          }

          out_file = OUT_DIR / f"{stamp}.json"
          out_file.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Saved:", out_file)

          # 古いファイル削除
          all_json = sorted(
              [
                  f for f in OUT_DIR.glob("*.json")
                  if f.name != "index.json"
              ],
              reverse=True
          )

          for f in all_json[max_files:]:
              print("Delete old:", f)
              f.unlink()

          # index作成
          files = []
          latest_valid = None
          last_attempt = out_file.name

          for f in sorted(
              [
                  x for x in OUT_DIR.glob("*.json")
                  if x.name != "index.json"
              ],
              reverse=True
          ):
              try:
                  item = json.loads(f.read_text(encoding="utf-8"))

                  valid = bool(item.get("any_ok"))
                  count = int(item.get("total_count") or 0)

                  entry = {
                      "stamp": item.get("stamp") or f.stem,
                      "file": f.name,
                      "path": f"./data/donki/{f.name}",
                      "generated_at": item.get("generated_at"),
                      "startDate": item.get("startDate"),
                      "endDate": item.get("endDate"),
                      "valid": valid,
                      "total_count": count,
                      "counts": {
                          "cmeAnalysis": item.get("sources", {}).get("cmeAnalysis", {}).get("count", 0),
                          "cme": item.get("sources", {}).get("cme", {}).get("count", 0),
                          "sep": item.get("sources", {}).get("sep", {}).get("count", 0),
                          "flr": item.get("sources", {}).get("flr", {}).get("count", 0)
                      }
                  }

                  files.append(entry)

                  if latest_valid is None and valid:
                      latest_valid = f.name

              except Exception as e:
                  files.append({
                      "stamp": f.stem,
                      "file": f.name,
                      "path": f"./data/donki/{f.name}",
                      "valid": False,
                      "error": str(e)
                  })

          index = {
              "updated_at": now.isoformat(),
              "latest": latest_valid,
              "last_attempt": last_attempt,
              "fetch_days": fetch_days,
              "max_files": max_files,
              "files": files
          }

          index_file = OUT_DIR / "index.json"
          index_file.write_text(
              json.dumps(index, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Saved:", index_file)
          print(json.dumps(index, ensure_ascii=False, indent=2))

          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/donki

          git commit -m "Update DONKI cache" || echo "No changes"
          git push
