name: Update SWIFT Monthly Excel Report

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: write

# All workflows that write SWIFT generated data/reports should use this same group.
# This prevents two SWIFT writer jobs from pushing to main at the same time.
concurrency:
  group: swift-space-weather-writer
  cancel-in-progress: false

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31.0" "xlsxwriter>=3.2.0"

      - name: Update NOAA history
        run: python scripts/update_noaa_space_weather_history.py

      - name: Learn CME wind boost
        run: python scripts/learn_cme_wind_boost.py

      - name: Build SWIFT Wind AI
        run: python scripts/build_swift_wind_ai.py

      - name: Build SWIFT Bz AI
        run: python scripts/build_swift_bz_ai.py

      - name: Build monthly Excel
        run: python scripts/build_swift_monthly_excel_report.py

      - name: Verify monthly output
        run: |
          MONTH="$(date -u +%Y-%m)"
          test -f "docs/reports/swift_space_weather_${MONTH}.xlsx"
          test -f "docs/reports/index.json"
          test -f "docs/reports/ui_forecast_latest.json"
          echo "Monthly Excel: docs/reports/swift_space_weather_${MONTH}.xlsx"
          echo "UI feed: docs/reports/ui_forecast_latest.json"
          cat docs/reports/index.json

      - name: Commit and push generated data safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # First commit the generated files locally.
          # This keeps the worktree clean before rebase.
          git add docs/data docs/reports || true

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "Update SWIFT monthly Excel report"

          # Remote main may have changed while Python was running.
          # Rebase the already-created local commit onto the newest main,
          # then retry push up to 3 times in case another commit lands.
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Remote changed again before push. Retrying..."
            sleep 5
          done

          echo "Push failed after 3 attempts."
          exit 1
